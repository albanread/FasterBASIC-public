  desc: "Copies a region with horizontal/vertical flipping"
  usage: |
    BLITFLIP src, dst, sx, sy, dx, dy, w, h, flip_mode

BLITSCALE:
  category: graphics_screen
  desc: "Copies a region with scaling"
  usage: |
    BLITSCALE src, dst, sx, sy, sw, sh, dx, dy, dw, dh

BLITSOLID:
  category: graphics_screen
  desc: "Copies a region treating a colour as transparent"
  usage: |
    BLITSOLID src, dst, sx, sy, dx, dy, w, h, transparent_colour

ELLIPSE:
  category: graphics_screen
  desc: "Draws an ellipse"
  usage: |
    ELLIPSE x, y, rx, ry
    ELLIPSE x, y, rx, ry, colour

FILLAREA:
  category: graphics_screen
  desc: "Flood-fills an area starting at the given point"
  usage: |
    FILLAREA x, y, fill_colour

FLIP:
  category: graphics_screen
  desc: "Swaps front and back screen buffers (double buffering)"
  usage: |
    FLIP

FRONTBUFFER:
  category: graphics_screen
  desc: "Directs drawing to the front (visible) buffer"
  usage: |
    FRONTBUFFER

GCOMMIT:
  category: graphics_screen
  desc: "Commits pending graphics operations to the screen"
  usage: |
    GCOMMIT

GLINE:
  category: graphics_screen
  desc: "Draws a line on the graphics screen"
  usage: |
    GLINE x1, y1, x2, y2
    GLINE x1, y1, x2, y2, colour

GSCROLL:
  category: graphics_screen
  desc: "Scrolls the graphics screen by a pixel offset"
  usage: |
    GSCROLL dx, dy

GWAIT:
  category: graphics_screen
  desc: "Waits for vertical blank (frame sync on the graphics screen)"
