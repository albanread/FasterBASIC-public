    CURSOR_RESTORE

CURSOR_SAVE:
  category: cursor
  desc: "Saves the current cursor position for later restoration"
  usage: |
    CURSOR_SAVE

  example: |
    CURSOR_SAVE
    ' Go somewhere else
    VDUMOVE 5, 5
    PRINT "Temporary info"
    CURSOR_RESTORE

CURSOR_SHOW:
  category: cursor
  desc: "Shows the text cursor"
  usage: |
    CURSOR_SHOW

  example: |
    CURSOR_SHOW

# ═══════════════════════════════════════════════════════════════════════════════
#  Terminal — Colour & Style
# ═══════════════════════════════════════════════════════════════════════════════

BLINK:
  category: style
  desc: "Enables blinking text attribute"
  usage: |
    BLINK
    PRINT "Attention!"
    NORMAL

  example: |
    BLINK : PRINT "ALERT" : NORMAL

BOLD:
  category: style
  desc: "Enables bold text attribute"
  usage: |
    BOLD
    PRINT "Important"
    NORMAL

  example: |
    BOLD : PRINT "HEAVY" : NORMAL

INVERSE:
  category: style
  desc: "Enables inverse (reverse video) text attribute"
  usage: |
    INVERSE
    PRINT "Highlighted"
    NORMAL

  example: |
    INVERSE : PRINT " REVERSE " : NORMAL

ITALIC:
  category: style
  desc: "Enables italic text attribute"
  usage: |
    ITALIC
    PRINT "Emphasised"
    NORMAL

  example: |
    ITALIC : PRINT "Slanted" : NORMAL

NORMAL:
  category: style
  desc: "Resets all text attributes to normal"
  usage: |
    BOLD
    PRINT "bold"
    NORMAL
    PRINT "normal again"

  example: |
    BOLD : PRINT "Yes" : NORMAL : PRINT "No"

RGB:
  category: style
  desc: "Sets text colour using 24-bit RGB values"
  usage: |
    RGB 255, 128, 0

  example: |
    RGB 255, 0, 0    ' Bright Red
    PRINT "Red Text"

RGBBG:
  category: style
  desc: "Sets background colour using 24-bit RGB values"
  usage: |
    RGBBG 0, 0, 128

  example: |
    ' Set background to dark blue
    RGBBG 0, 0, 100
    GCLS

RGBFG:
  category: style
  desc: "Sets foreground colour using 24-bit RGB values"
  usage: |
    RGBFG 255, 255, 0

  example: |
    ' Set foreground to bright yellow
    RGBFG 255, 255, 0
    PRINT "Yellow Text"

STYLE_RESET:
  category: style
  desc: "Resets all text style attributes to default"
  usage: |
    STYLE_RESET

  example: |
    BOLD : UNDERLINE : RGB 255, 0, 0
    PRINT "Fancy Text"
    STYLE_RESET
    PRINT "Normal Text"

UNDERLINE:
  category: style
  desc: "Enables underlined text attribute"
  usage: |
    UNDERLINE
    PRINT "Underlined"
    NORMAL

  example: |
    UNDERLINE : PRINT "Link Style" : NORMAL

# ═══════════════════════════════════════════════════════════════════════════════
#  Terminal — Keyboard Input
# ═══════════════════════════════════════════════════════════════════════════════

INKEY:
  category: keyboard
  desc: "Waits for a keypress and returns the character code"
  usage: |
    key = INKEY

  example: |
    PRINT "Press any key..."
    DIM k AS INTEGER
    k = INKEY
    PRINT "Key code: "; k

KBCLEAR:
  category: keyboard
  desc: "Clears the keyboard buffer"
  usage: |
    KBCLEAR

  example: |
    ' Clear input buffer before critical operation
    KBCLEAR
    PRINT "Input buffer cleared"

KBCOUNT:
  category: keyboard
  desc: "Returns the number of keys waiting in the keyboard buffer"
  usage: |
    n = KBCOUNT

  example: |
    ' Check if any keys are waiting
    IF KBCOUNT > 0 THEN
        PRINT "Buffer has input"
    ELSE
        PRINT "Buffer is empty"
    END IF

KBECHO:
  category: keyboard
  desc: "Enables or disables keyboard echo to the screen"
  usage: |
    KBECHO ON
    KBECHO OFF

  example: |
    KBECHO OFF
    PRINT "Password field (hidden): ";
    ' ... get input ...
    KBECHO ON

KBFLUSH:
  category: keyboard
  desc: "Flushes (discards) all pending keyboard input"
  usage: |
    KBFLUSH

  example: |
    ' Discard any extra keys
    KBFLUSH
    PRINT "Buffer flushed"

KBGET:
  category: keyboard
  desc: "Gets a single keypress from the keyboard buffer (waits if empty)"
  usage: |
    key = KBGET

  example: |
    PRINT "Press any key..."
    DIM k AS INTEGER = KBGET
    PRINT "You pressed: "; CHR$(k)

KBHIT:
  category: keyboard
  desc: "Returns TRUE if a key has been pressed (non-blocking check)"
  usage: |
    IF KBHIT THEN
      key = KBGET
    END IF

  example: |
    DO
        IF KBHIT THEN
            PRINT "Key: "; KBGET
            EXIT DO
        END IF
    LOOP

KBINPUT:
  category: keyboard
  desc: "Reads a line of input from the keyboard"
  usage: |
    line$ = KBINPUT

  example: |
    PRINT "Type something: ";
    DIM s AS STRING = KBINPUT
    PRINT "You typed: "; s

KBMOD:
  category: keyboard
  desc: "Returns the current keyboard modifier state (Shift, Ctrl, Alt)"
  usage: |
    mods = KBMOD

  example: |
    DIM m = KBMOD
    IF m AND 1 THEN PRINT "Shift held"

KBPEEK:
  category: keyboard
  desc: "Returns the next key in the buffer without removing it"
  usage: |
    key = KBPEEK

  example: |
    IF KBPEEK = 27 THEN PRINT "Escape is next"

KBRAW:
  category: keyboard
  desc: "Gets raw keyboard input (scan codes, not translated)"
  usage: |
    code = KBRAW

  example: |
    PRINT "Press key for scan code: ";
    PRINT KBRAW

KBSPECIAL:
  category: keyboard
  desc: "Returns TRUE if the last keypress was a special key (arrow, F-key, etc.)"
  usage: |
    IF KBSPECIAL THEN PRINT "special key"

  example: |
    DIM k = KBGET
    IF KBSPECIAL THEN PRINT "Special key detected"

KBCODE:
  category: keyboard
  desc: "Returns the raw scan code of the last keypress"
  usage: |
    code = KBCODE

  example: |
    DIM key = KBGET
    PRINT "Key: "; key; " Code: "; KBCODE

# ═══════════════════════════════════════════════════════════════════════════════
#  Terminal — Paint / Buffered Output
# ═══════════════════════════════════════════════════════════════════════════════

BEGINPAINT:
  category: terminal
  desc: "Begins a buffered paint session — output is deferred until ENDPAINT"
  usage: |
    BEGINPAINT
    CLS
    LOCATE 1, 1 : PRINT "Header"
    LOCATE 24, 1 : PRINT "Footer"
    ENDPAINT

  example: |
    ' Prevent flickering during multi-line updates
    BEGINPAINT
    CLS
    FOR i = 1 TO 20 : PRINT "Line "; i : NEXT i
    ENDPAINT

ENDPAINT:
  category: terminal
  desc: "Ends a buffered paint session and flushes output to the terminal"
  usage: |
    BEGINPAINT
    ' ... draw operations ...
    ENDPAINT

  example: |
    BEGINPAINT : PRINT "Atomic update" : ENDPAINT

FLUSH:
  category: terminal
  desc: "Flushes pending terminal output immediately"
  usage: |
    FLUSH

  example: |
    PRINT "Working...";
    FLUSH
    ' ... some slow work ...
    PRINT " Done"

SCREENHEIGHT:
  category: terminal
  desc: "Returns the terminal height in rows"
  usage: |
    rows = SCREENHEIGHT

  example: |
    PRINT "Terminal height: "; SCREENHEIGHT; " rows"

SCREENWIDTH:
  category: terminal
  desc: "Returns the terminal width in columns"
  usage: |
    cols = SCREENWIDTH

  example: |
    PRINT "Terminal width: "; SCREENWIDTH; " cols"

# ═══════════════════════════════════════════════════════════════════════════════
#  Text Layer
# ═══════════════════════════════════════════════════════════════════════════════

DRAWTEXT:
  category: text_layer
  desc: "Draws text and numbers at a specific position on the graphics screen"
  usage: |
    DRAWTEXT x, y, item1, item2, ..., colour [, size]
  example: |
    DRAWTEXT 10, 10, "Score: ", score, &HFFFFFFFF
    ' Supports mixed literals and variables without string allocations:
    DRAWTEXT 10, 30, "X: ", x, " Y: ", y; " Level ", lvl, &HFF00FFFF, 2.0

TCHAR:
  category: text_layer
  desc: "Writes a character to a specific text grid cell"
  usage: |
    TCHAR col, row, char_code

TCLEAR:
  category: text_layer
  desc: "Clears the text layer grid"
  usage: |
    TCLEAR

TEXTHEIGHT:
  category: text_layer
  desc: "Returns the height of a text string in pixels"
  usage: |
    h = TEXTHEIGHT("Hello")

TEXTPUT:
  category: text_layer
  desc: "Places a string at a specific position on the text grid"
  usage: |
    TEXTPUT col, row, "Score: 100"

TEXTWIDTH:
  category: text_layer
  desc: "Returns the width of a text string in pixels"
  usage: |
    w = TEXTWIDTH("Hello")

TGRID:
  category: text_layer
  desc: "Sets the dimensions of the text layer grid"
  usage: |
    TGRID cols, rows

TSCROLL:
  category: text_layer
  desc: "Scrolls the text layer grid"
  usage: |
    TSCROLL direction, amount

