    TRIANGLE x1, y1, x2, y2, x3, y3
    TRIANGLE x1, y1, x2, y2, x3, y3, colour

VSYNC:
  category: graphics_screen
  desc: "Waits for vertical sync (frame timing)"
  usage: |
    VSYNC

# ═══════════════════════════════════════════════════════════════════════════════
#  Graphics — Palette
# ═══════════════════════════════════════════════════════════════════════════════

LINEPALETTE:
  category: palette
  desc: "Sets a per-scanline palette for raster effects"
  usage: |
    LINEPALETTE line, index, r, g, b

LINEPALETTEGET:
  category: palette
  desc: "Gets the palette colour for a specific scanline"
  usage: |
    LINEPALETTEGET line, index, r, g, b

PALCYCLE:
  category: palette
  desc: "Initiates automatic cycling for a range of global palette entries (Indices 16-255)"
  usage: |
    PALCYCLE start_index, end_index, speed

  example: |
    ' Rainbow cycle on global colors
    FOR i = 16 TO 31 : PALETTE i, RND(0,256), RND(0,256), RND(0,256) : NEXT i
    PALCYCLE 16, 31, 5

PALFADE:
  category: palette
  desc: "Fades the palette towards a target colour"
  usage: |
    PALFADE target_r, target_g, target_b, speed

PALGRADIENT:
  category: palette
  desc: "Sets a range of palette entries to a colour gradient"
  usage: |
    PALGRADIENT start_index, end_index, r1, g1, b1, r2, g2, b2

PALETTE:
  category: palette
  desc: "Sets a global (per-screen) palette entry to an RGB colour (Indices 16-255)"
  usage: |
    PALETTE index, r, g, b

  example: |
    PALETTE 16, 255, 0, 0    ' Red
    PALETTE 17, 0, 255, 0    ' Green
    PALETTE 18, 0, 0, 255    ' Blue

PALETTEGET:
  category: palette
  desc: "Gets the RGB values of a palette entry"
  usage: |
    PALETTEGET index, r, g, b

PALPAUSE:
  category: palette
  desc: "Pauses active palette animations"
  usage: |
    PALPAUSE

PALPULSE:
  category: palette
  desc: "Starts a pulsing palette animation"
  usage: |
    PALPULSE start_index, end_index, speed

PALRESUME:
  category: palette
  desc: "Resumes paused palette animations"
  usage: |
    PALRESUME

PALSTOP:
  category: palette
  desc: "Stops a specific palette animation"
  usage: |
    PALSTOP

PALSTOPALL:
  category: palette
  desc: "Stops all active palette animations"
  usage: |
    PALSTOPALL

PALSTROBE:
  category: palette
  desc: "Starts a strobing palette animation"
  usage: |
    PALSTROBE start_index, end_index, speed

RESETPALETTE:
  category: palette
  desc: "Resets all palette entries to default colours"
  usage: |
    RESETPALETTE

# ═══════════════════════════════════════════════════════════════════════════════
#  Graphics — Collision Detection
# ═══════════════════════════════════════════════════════════════════════════════

GCOLLIDE:
  category: collision
  desc: "Performs a fast circle-based collision test between two sprite instances"
  usage: |
    result = GCOLLIDE(inst_a, inst_b)
  example: |
    ' Simple circle check
    IF GCOLLIDE(player_inst, enemy_inst) THEN
      PRINT "Hit!"
    END IF

GCOLLIDERESULT:
  category: collision
  desc: "Returns detailed distance/intersection info about the last GCOLLIDE test"
  usage: |
    info = GCOLLIDERESULT
  example: |
    IF GCOLLIDE(1, 2) THEN
      DIM d AS FLOAT = GCOLLIDERESULT
      PRINT "Intersection depth: "; d
    END IF

GCOLLIDESETUP:
  category: collision
  desc: "Configures current collision mode (0: Circle, 1: Box, 2: Pixel)"
  usage: |
    GCOLLIDESETUP mode
  example: |
    GCOLLIDESETUP 1  ' Use bounding boxes
    IF GCOLLIDE(1, 2) THEN PRINT "Box Collision"

GCOLLIDESRC:
  category: collision
  desc: "Sets the reference instance for multi-target collision testing"
  usage: |
    GCOLLIDESRC inst_id
  example: |
    ' Setup source once
    GCOLLIDESRC player_inst
    ' Then test many targets against it efficiently
    IF GCOLLIDETEST(enemy1_inst) THEN PRINT "Hit 1"
    IF GCOLLIDETEST(enemy2_inst) THEN PRINT "Hit 2"

GCOLLIDETEST:
  category: collision
  desc: "Tests the preset source against a target instance"
  usage: |
    hit = GCOLLIDETEST(target_inst)
  example: |
    GCOLLIDESRC 0
    FOR i = 1 TO 10
      IF GCOLLIDETEST(i) THEN SPRHIDE i
    NEXT i

# ═══════════════════════════════════════════════════════════════════════════════
#  Graphics — Screen Queries
# ═══════════════════════════════════════════════════════════════════════════════

GBUFFERHEIGHT:
  category: graphics_query
  desc: "Returns the height of the graphics back buffer in pixels"
  usage: |
    h = GBUFFERHEIGHT

  example: |
    PRINT "Back buffer height: "; GBUFFERHEIGHT

GBUFFERWIDTH:
  category: graphics_query
  desc: "Returns the width of the graphics back buffer in pixels"
  usage: |
    w = GBUFFERWIDTH

  example: |
    PRINT "Back buffer width: "; GBUFFERWIDTH

GFENCE:
  category: graphics_query
  desc: "Inserts a fence to ensure all prior drawing is complete"
  usage: |
    GFENCE

  example: |
    GFENCE
    PRINT "Fence inserted"

GFENCEDONE:
  category: graphics_query
  desc: "Checks whether a previously inserted GFENCE has completed"
  usage: |
    IF GFENCEDONE THEN PRINT "ready"

  example: |
    GFENCE
    DO : LOOP UNTIL GFENCEDONE
    PRINT "Graphics sync complete"

GINKEY:
  category: graphics_query
  desc: "Returns the last keypress from the graphics window"
  usage: |
    key = GINKEY

  example: |
    DIM k AS INTEGER = GINKEY
    IF k <> 0 THEN PRINT "Last key: "; k

GKEYDOWN:
  category: graphics_query
  desc: "Returns TRUE if a specific key is currently held down"
  usage: |
    IF GKEYDOWN(key_code) THEN PRINT "pressed"

  example: |
    IF GKEYDOWN(27) THEN PRINT "Escape is held down"

GMOUSEBUTTON:
  category: graphics_query
  desc: "Returns the mouse button state in the graphics window"
  usage: |
    btn = GMOUSEBUTTON

  example: |
    DIM b AS INTEGER = GMOUSEBUTTON
    IF b AND 1 THEN PRINT "Left button down"

GMOUSESCROLL:
  category: graphics_query
  desc: "Returns the mouse scroll wheel delta"
  usage: |
    scroll = GMOUSESCROLL

  example: |
    DIM s AS DOUBLE = GMOUSESCROLL
    IF s <> 0 THEN PRINT "Scroll delta: "; s

GMOUSEX:
  category: graphics_query
  desc: "Returns the mouse X position in the graphics window"
  usage: |
    mx = GMOUSEX

  example: |
    PRINT "Mouse position: "; GMOUSEX; ", "; GMOUSEY

GMOUSEY:
  category: graphics_query
  desc: "Returns the mouse Y position in the graphics window"
  usage: |
    my = GMOUSEY

  example: |
    PRINT "Mouse Y: "; GMOUSEY

GSCREENHEIGHT:
  category: graphics_query
  desc: "Returns the height of the graphics screen in pixels"
  usage: |
    h = GSCREENHEIGHT

  example: |
    PRINT "Screen: "; GSCREENWIDTH; "x"; GSCREENHEIGHT

GSCREENWIDTH:
  category: graphics_query
  desc: "Returns the width of the graphics screen in pixels"
  usage: |
    w = GSCREENWIDTH

  example: |
    PRINT "Screen Width: "; GSCREENWIDTH

