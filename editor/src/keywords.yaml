    SCREENMODE mode

SCREENTITLE:
  category: graphics_screen
  desc: "Sets the title bar text of the graphics window"
  usage: |
    SCREENTITLE "My Application"

SETSCROLL:
  category: graphics_screen
  desc: "Sets the scroll offset for the graphics screen"
  usage: |
    SETSCROLL x_offset, y_offset

SETTARGET:
