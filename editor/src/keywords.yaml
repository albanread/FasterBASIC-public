  category: graphics
  desc: "Draws a filled circle"
  usage: |
    CIRCLEF x, y, radius
    CIRCLEF x, y, radius, colour

  example: |
    CIRCLEF 100, 100, 30, RGB(255, 0, 0)

CLG:
  category: graphics
  desc: "Clears the graphics screen (alias for GCLS)"
  usage: |
    CLG
    CLG colour

  example: |
    GCLS RGB(0, 0, 0)

GCLS:
  category: graphics
  desc: "Clears the graphics screen"
  usage: |
    GCLS
