# ─────────────────────────────────────────────────────────────────────────────
# FasterBASIC Keyword Reference
# ─────────────────────────────────────────────────────────────────────────────
#
# This file is the authoritative keyword reference for the Ed editor.
# When a user invokes Go-to-Definition (F12 / right-click) on a keyword,
# the editor displays the usage information from this file in the terminal.
#
# Format:
#   Each keyword entry has:
#     desc:   One-line description
#     usage:  Syntax / usage pattern(s), one per line
#     category: Grouping for organisation
#
# Maintain alphabetical order within each category block.
# ─────────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════════════
#  Control Flow
# ═══════════════════════════════════════════════════════════════════════════════

CASE:
  category: control_flow
  desc: "Introduces a value to match in a SELECT CASE block"
  usage: |
    SELECT CASE expression
      CASE value
        statements
      CASE value1, value2
        statements
      CASE value1 TO value2
        statements
      CASE IS > value
        statements
      CASE OTHERWISE
        statements
    ENDCASE

DO:
  category: control_flow
  desc: "Begins a DO...LOOP block"
  usage: |
    DO
      statements
    LOOP
    DO
      statements
    LOOP WHILE condition
    DO
      statements
    LOOP UNTIL condition

  example: |
    DIM n AS INTEGER
    n = 1
    DO
        PRINT n
        INC n
    LOOP WHILE n <= 5
    ' Also works with UNTIL:
    DIM x AS INTEGER
    x = 10
    DO
        PRINT x
        DEC x, 3
    LOOP UNTIL x <= 0


DONE:
  category: control_flow
  desc: "Marks the end of a block (alternative to LOOP/WEND)"
  usage: |
    REPEAT
      statements
    DONE

ELSE:
  category: control_flow
  desc: "Introduces the alternative branch of an IF statement"
  usage: |
    IF condition THEN
      statements
    ELSE
      statements
    END IF

ELSEIF:
  category: control_flow
  desc: "Introduces an additional conditional branch"
  usage: |
    IF condition THEN
      statements
    ELSEIF condition THEN
      statements
    ELSE
      statements
    END IF

END:
  category: control_flow
  desc: "Terminates the program, or closes a block (END IF, END SUB, etc.)"
  usage: |
    END
    END IF
    END SUB
    END FUNCTION
    END TYPE
    END CLASS
    END WORKER
    END SELECT

ENDCASE:
  category: control_flow
  desc: "Closes a SELECT CASE block"
  usage: |
    SELECT CASE x
      CASE 1
        PRINT "one"
    ENDCASE

ENDIF:
  category: control_flow
  desc: "Closes a multi-line IF block (alternative to END IF)"
  usage: |
    IF condition THEN
      statements
    ENDIF

ENDMATCH:
  category: control_flow
  desc: "Closes a MATCH TYPE or MATCH RECEIVE block (one-word alternative to END MATCH)"
  usage: |
    MATCH TYPE E
        CASE INTEGER n%
            PRINT n%
        CASE STRING s$
            PRINT s$
    ENDMATCH
    ' ENDMATCH and END MATCH are interchangeable.

EXIT:
  category: control_flow
  desc: "Exits the current loop, SUB, or FUNCTION early"
  usage: |
    EXIT FOR
    EXIT WHILE
    EXIT DO
    EXIT REPEAT
    EXIT SUB
    EXIT FUNCTION
    EXIT WORKER

  example: |
    ' EXIT FOR — leave a loop early:
    FOR i = 1 TO 10
        IF i = 4 THEN EXIT FOR
        PRINT i
    NEXT i
    ' EXIT WHILE:
    DIM n AS INTEGER
    n = 0
    WHILE 1 = 1
        INC n
        IF n >= 3 THEN EXIT WHILE
        PRINT n
    WEND
    PRINT "Exited at n = "; n


FOR:
  category: control_flow
  desc: "Begins a counted FOR...NEXT loop, FOR creates its own"
  usage: |
    FOR variable = start TO end
      statements
    NEXT variable
    FOR variable = start TO end STEP increment
      statements
    NEXT variable
    FOR EACH item IN collection
      statements
    NEXT item

  example: |
    FOR i = 1 TO 5
        PRINT i
    NEXT i
    ' Count down with STEP:
    FOR i = 10 TO 1 STEP -2
        PRINT i
    NEXT i


EACH:
  category: control_flow
  desc: "Used with FOR to iterate over each element in a collection"
  usage: |
    FOR EACH item IN myList
      PRINT item
    NEXT item

  example: |
    DIM fruits AS LIST OF STRING
    fruits.APPEND("apple")
    fruits.APPEND("banana")
    fruits.APPEND("cherry")
    FOR EACH item$ IN fruits
        PRINT item$
    NEXT item$


GOSUB:
  category: control_flow
  desc: "Branches to a labelled subroutine; RETURN jumps back"
  usage: |
    GOSUB MyLabel
    ...
    MyLabel:
      statements
      RETURN

  example: |
    PRINT "Before subroutine"
    GOSUB Greet
    PRINT "After subroutine"
    END

    Greet:
        PRINT "Hello from GOSUB!"
        RETURN


GOTO:
  category: control_flow
  desc: "Unconditional jump to a labelled line"
  usage: |
    GOTO MyLabel
    ...
    MyLabel:
      statements

IF:
  category: control_flow
  desc: "Conditional execution"
  usage: |
    IF condition THEN statement
    IF condition THEN
      statements
    END IF
    IF condition THEN
      statements
    ELSE
      statements
    END IF
    IF condition THEN
      statements
    ELSEIF condition THEN
      statements
    ELSE
      statements
    END IF

  example: |
    DIM score AS INTEGER
    score = 72
    IF score >= 90 THEN
        PRINT "A"
    ELSEIF score >= 80 THEN
        PRINT "B"
    ELSEIF score >= 70 THEN
        PRINT "C"
    ELSE
        PRINT "Below C"
    END IF


IN:
  category: control_flow
  desc: "Used with FOR EACH to specify the collection to iterate"
  usage: |
    FOR EACH item IN myList
      PRINT item
    NEXT item

  example: |
    DIM names AS LIST OF STRING
    APPEND names, "Alice" : APPEND names, "Bob"
    FOR EACH n IN names
        PRINT n
    NEXT n

IS:
  category: control_flow
  desc: "Used in SELECT CASE for comparison operators"
  usage: |
    SELECT CASE score
      CASE IS >= 90
        PRINT "A"
      CASE IS >= 80
        PRINT "B"
    ENDCASE

  example: |
    DIM x = 75
    SELECT CASE x
        CASE IS >= 90 : PRINT "A"
        CASE IS >= 80 : PRINT "B"
        CASE IS >= 70 : PRINT "C"
        CASE ELSE     : PRINT "F"
    END SELECT

LOOP:
  category: control_flow
  desc: "Closes a DO...LOOP block, optionally with WHILE/UNTIL condition"
  usage: |
    DO
      statements
    LOOP
    DO
      statements
    LOOP WHILE condition
    DO
      statements
    LOOP UNTIL condition

  example: |
    DIM i AS INTEGER = 1
    DO
        PRINT i
        i = i + 1
    LOOP WHILE i <= 3

MATCH:
  category: control_flow
  desc: "Type-dispatching pattern match — MATCH TYPE on a variable, or MATCH RECEIVE for worker messages"
  usage: |
    ' ── MATCH TYPE: dispatch on the runtime type of a variable ──────────────
    MATCH TYPE expression
        CASE INTEGER n%
            statements
        CASE LONG n&
            statements
        CASE DOUBLE f#
            statements
        CASE STRING s$
            statements
        CASE LIST sub
            statements
        CASE OBJECT obj         ' catches any class instance
            statements
        CASE ClassName varname  ' specific class or UDT name
            statements
        CASE ELSE               ' default fallback (optional)
            statements
    END MATCH

    ' ── MATCH RECEIVE: pop and dispatch a typed worker message ───────────────
    MATCH RECEIVE(workerHandle)
        CASE DOUBLE tick
            statements
        CASE INTEGER n%
            statements
        CASE STRING s$
            statements
        CASE UdtTypeName binding
            statements
        CASE ClassName varname
            statements
        CASE ELSE
            statements
    END MATCH

  example: |
    DIM val AS OBJECT = 42
    MATCH TYPE val
        CASE INTEGER n
            PRINT "It's an integer: "; n
        CASE STRING s
            PRINT "It's a string: "; s
        CASE ELSE
            PRINT "Other type"
    END MATCH

NEXT:
  category: control_flow
  desc: "Closes a FOR loop and advances the loop variable"
  usage: |
    FOR i = 1 TO 10
      PRINT i
    NEXT i

  example: |
    FOR i = 1 TO 3
        PRINT i;
    NEXT i

OF:
  category: control_flow
  desc: "Used with collection types (LIST OF)"
  usage: |
    DIM names AS LIST OF STRING

  example: |
    DIM numbers AS LIST OF INTEGER
    APPEND numbers, 10
    PRINT numbers(1)

ON:
  category: control_flow
  desc: "Computed GOTO/GOSUB based on an expression value"
  usage: |
    ON expression GOTO label1, label2, label3
    ON expression GOSUB label1, label2, label3

  example: |
    DIM choice = 2
    ON choice GOTO Label1, Label2
    END
    Label1: PRINT "Option 1" : END
    Label2: PRINT "Option 2" : END

ONEVENT:
  category: control_flow
  desc: "Registers an event handler for timed or input events"
  usage: |
    ONEVENT handler_sub

  example: |
    SUB Alert() : PRINT "!" : END SUB
    ONEVENT Alert

OTHERWISE:
  category: control_flow
  desc: "Default case in SELECT CASE or MATCH when no other case matches"
  usage: |
    SELECT CASE x
      CASE 1
        PRINT "one"
      CASE OTHERWISE
        PRINT "other"
    ENDCASE

  example: |
    DIM status = 2
    SELECT CASE status
        CASE 1 : PRINT "Red"
        CASE OTHERWISE : PRINT "Default"
    END SELECT

REPEAT:
  category: control_flow
  desc: "Begins a REPEAT...UNTIL loop (executes at least once)"
  usage: |
    REPEAT
      statements
    UNTIL condition

  example: |
    DIM i = 1
    REPEAT
        PRINT i
        i = i + 1
    UNTIL i > 5

  example: |
    DIM n AS INTEGER
    n = 1
    REPEAT
        PRINT n
        INC n
    UNTIL n > 5


RETURN:
  category: control_flow
  desc: "Returns from a GOSUB subroutine, or returns a value from FUNCTION"
  usage: |
    GOSUB MyLabel
    ...
    MyLabel:
      statements
      RETURN

SELECT:
  category: control_flow
  desc: "Begins a SELECT CASE multi-way branch"
  usage: |
    SELECT CASE expression
      CASE value1
        statements
      CASE value2
        statements
      CASE OTHERWISE
        statements
    ENDCASE

  example: |
    DIM day AS INTEGER
    day = 3
    SELECT CASE day
        CASE 1
            PRINT "Monday"
        CASE 2
            PRINT "Tuesday"
        CASE 3
            PRINT "Wednesday"
        CASE 4, 5
            PRINT "Thu or Fri"
        CASE 6 TO 7
            PRINT "Weekend"
        CASE OTHERWISE
            PRINT "Unknown"
    ENDCASE


STEP:
  category: control_flow
  desc: "Specifies the increment in a FOR loop"
  usage: |
    FOR i = 10 TO 1 STEP -1
      PRINT i
    NEXT i

STOP:
  category: control_flow
  desc: "Halts program execution (breakpoint / debug stop)"
  usage: |
    STOP

THEN:
  category: control_flow
  desc: "Introduces the body of an IF statement"
  usage: |
    IF condition THEN
      statements
    END IF
    IF condition THEN statement

TO:
  category: control_flow
  desc: "Specifies the end value in a FOR loop or CASE range"
  usage: |
    FOR i = 1 TO 100
      PRINT i
    NEXT i
    CASE 1 TO 10

UNTIL:
  category: control_flow
  desc: "Loop termination condition for REPEAT or DO loops"
  usage: |
    REPEAT
      statements
    UNTIL condition
    DO
      statements
    LOOP UNTIL condition

  example: |
    DIM x = 0
    REPEAT
        x = x + 1
        PRINT x
    UNTIL x >= 3

WEND:
  category: control_flow
  desc: "Closes a WHILE...WEND loop"
  usage: |
    WHILE condition
      statements
    WEND

  example: |
    DIM n = 5
    WHILE n > 0
        PRINT n
        n = n - 1
    WEND

WHEN:
  category: control_flow
  desc: "Introduces a case arm in a SELECT CASE block (alternative to CASE)"
  usage: |
    SELECT CASE x
        WHEN 1
            PRINT "one"
        WHEN 2, 3
            PRINT "two or three"
        WHEN 4 TO 9
            PRINT "four to nine"
        CASE OTHERWISE
            PRINT "other"
    ENDCASE

WHILE:
  category: control_flow
  desc: "Begins a WHILE...WEND loop (tests condition before each iteration)"
  usage: |
    WHILE condition
      statements
    WEND

  example: |
    DIM n AS INTEGER
    n = 1
    WHILE n <= 5
        PRINT n
        INC n
    WEND


# ═══════════════════════════════════════════════════════════════════════════════
#  Exception Handling
# ═══════════════════════════════════════════════════════════════════════════════

CATCH:
  category: exception
  desc: "Catches an exception thrown inside a TRY block"
  usage: |
    TRY
      statements
    CATCH
      PRINT "Error: "; ERR
    FINALLY
      ' cleanup
    END TRY

  example: |
    TRY
        OPEN "not-found.txt" FOR INPUT AS #1
    CATCH
        PRINT "File not found error caught"
    END TRY

FINALLY:
  category: exception
  desc: "Code that always runs after TRY/CATCH, whether or not an error occurred"
  usage: |
    TRY
      statements
    CATCH
      PRINT ERR
    FINALLY
      CLOSE #1
    END TRY

  example: |
    TRY
        OPEN "log.txt" FOR OUTPUT AS #1
        PRINT #1, "Operation log"
    CATCH
        PRINT "Log write failed"
    FINALLY
        CLOSE #1  ' Guaranteed to close
    END TRY

THROW:
  category: exception
  desc: "Raises a runtime error that can be caught by TRY/CATCH"
  usage: |
    THROW "Something went wrong"
    THROW error_code

  example: |
    SUB CheckAge(age AS INTEGER)
        IF age < 0 THEN THROW "Age cannot be negative"
        PRINT "Age is "; age
    END SUB
    TRY
        CheckAge(25)
        CheckAge(-1)
    CATCH
        PRINT "Error: "; ERR
    END TRY


ERR:
  category: exception
  desc: "Returns the error number of the most recent runtime error"
  usage: |
    TRY
      ' risky operation
    CATCH
      PRINT "Error code: "; ERR
    END TRY

  example: |
    TRY
        ' Simulate out of memory or similar
        ERROR 7
    CATCH
        IF ERR = 7 THEN PRINT "Error 7 caught"
    END TRY

ERL:
  category: exception
  desc: "Returns the line number where the most recent runtime error occurred"
  usage: |
    TRY
      ' risky operation
    CATCH
      PRINT "Error at line "; ERL
    END TRY

  example: |
    TRY
        PRINT 1/0
    CATCH
        PRINT "Error at line: "; ERL
    END TRY

ERROR:
  category: exception
  desc: "Raises a runtime error with the specified error code"
  usage: |
    ERROR 5
    ERROR errcode

  example: |
    DIM MY_ERROR AS INTEGER = 123
    IF problem THEN ERROR MY_ERROR

TRY:
  category: exception
  desc: "Begins a protected block; errors are caught by CATCH"
  usage: |
    TRY
      statements
    CATCH
      PRINT "Error: "; ERR
    END TRY

  example: |
    TRY
        PRINT "Trying risky code..."
        THROW "Something went wrong"
    CATCH
        PRINT "Caught error: "; ERR
    FINALLY
        PRINT "Finally block always runs"
    END TRY


# ═══════════════════════════════════════════════════════════════════════════════
#  Functions & Procedures
# ═══════════════════════════════════════════════════════════════════════════════

CALL:
  category: procedure
  desc: "Explicitly calls a SUB procedure"
  usage: |
    CALL MySub(arg1, arg2)

DEF:
  category: procedure
  desc: "Defines an inline function (DEF FN)"
  usage: |
    DEF FN Square(x) = x * x
    DEF FN Cube(x AS INTEGER) AS INTEGER = x * x * x

  example: |
    DEF FN Square(x) = x * x
    DEF FN Cube(x AS DOUBLE) AS DOUBLE = x * x * x

    PRINT FN Square(4)       ' 16
    PRINT FN Cube(3.0)       ' 27


ENDSUB:
  category: procedure
  desc: "Closes a SUB block (alternative to END SUB)"
  usage: |
    SUB MyProc()
      statements
    ENDSUB

ENDFUNCTION:
  category: procedure
  desc: "Closes a FUNCTION block (alternative to END FUNCTION)"
  usage: |
    FUNCTION MyFunc() AS INTEGER
      MyFunc = 42
    ENDFUNCTION

FN:
  category: procedure
  desc: "Used with DEF to define an inline function"
  usage: |
    DEF FN Double(x) = x * 2
    result = FN Double(21)

FUNCTION:
  category: procedure
  desc: "Declares a function that returns a value"
  usage: |
    FUNCTION name(params) AS ReturnType
      statements
      name = return_value
    END FUNCTION
    FUNCTION Add(a AS INTEGER, b AS INTEGER) AS INTEGER
      Add = a + b
    END FUNCTION

  example: |
    FUNCTION Add(a AS INTEGER, b AS INTEGER) AS INTEGER
        Add = a + b
    END FUNCTION

    FUNCTION Factorial(n AS INTEGER) AS INTEGER
        IF n <= 1 THEN
            Factorial = 1
        ELSE
            Factorial = n * Factorial(n - 1)
        END IF
    END FUNCTION

    PRINT Add(3, 4)          ' 7
    PRINT Factorial(5)       ' 120


SUB:
  category: procedure
  desc: "Declares a subroutine (procedure that does not return a value)"
  usage: |
    SUB name(params)
      statements
    END SUB
    SUB Greet(name$ AS STRING)
      PRINT "Hello, "; name$
    END SUB

  example: |
    SUB Greet(name AS STRING)
        PRINT "Hello, "; name; "!"
    END SUB

    SUB PrintLine(ch AS STRING, count AS INTEGER)
        DIM i AS INTEGER
        FOR i = 1 TO count
            WRCH ch
        NEXT i
        PRINT ""
    END SUB

    Greet("World")
    Greet("FasterBASIC")
    PrintLine("-", 20)


IIF:
  category: procedure
  desc: "Inline IF — returns one of two values based on a condition"
  usage: |
    result = IIF(condition, true_value, false_value)
    msg$ = IIF(score >= 50, "Pass", "Fail")

  example: |
    DIM score AS INTEGER
    score = 73
    PRINT IIF(score >= 50, "Pass", "Fail")   ' Pass

    DIM x AS INTEGER
    x = -5
    PRINT IIF(x >= 0, x, -x)                ' 5  (absolute value)


# ═══════════════════════════════════════════════════════════════════════════════
#  Parameter Passing
# ═══════════════════════════════════════════════════════════════════════════════

AS:
  category: declaration
  desc: "Specifies the type of a variable, parameter, or function return"
  usage: |
    DIM x AS INTEGER
    DIM name$ AS STRING
    FUNCTION Calc(n AS DOUBLE) AS DOUBLE
    SUB Process(data AS STRING)

  example: |
    DIM count AS INTEGER
    DIM message AS STRING = "Status: "
    count = 10
    PRINT message; count

BYREF:
  category: declaration
  desc: "Pass parameter by reference (callee can modify the original variable)"
  usage: |
    SUB Increment(BYREF x AS INTEGER)
      x = x + 1
    END SUB

  example: |
    SUB DoubleIt(BYREF n AS INTEGER)
        n = n * 2
    END SUB
    DIM x = 5
    DoubleIt(x)
    PRINT x    ' 10

BYVAL:
  category: declaration
  desc: "Pass parameter by value (callee gets a copy)"
  usage: |
    SUB Display(BYVAL x AS INTEGER)
      PRINT x
    END SUB

  example: |
    SUB SafeAdd(BYVAL n AS INTEGER)
        n = n + 10
    END SUB
    DIM x = 5
    SafeAdd(x)
    PRINT x    ' 5

# ═══════════════════════════════════════════════════════════════════════════════
#  Variables & Data
# ═══════════════════════════════════════════════════════════════════════════════

CONSTANT:
  category: data
  desc: "Declares a named constant (value cannot be changed)"
  usage: |
    CONSTANT PI = 3.14159265
    CONSTANT MAX_SIZE = 1024
    CONSTANT APP_NAME = "MyApp"

  example: |
    CONSTANT PI = 3.14159265358979
    CONSTANT MAX_SIZE = 100
    CONSTANT APP_NAME = "FasterBASIC"

    PRINT APP_NAME
    PRINT "PI = "; PI
    PRINT "Circle area (r=5): "; PI * 5 * 5


DATA:
  category: data
  desc: "Stores inline data values to be read with READ"
  usage: |
    DATA 10, 20, 30, 40, 50
    DATA "Alice", "Bob", "Charlie"
    READ x
    READ name$

  example: |
    DATA 10, 20, 30, 40, 50
    DIM total AS INTEGER
    DIM val AS INTEGER
    total = 0
    FOR i = 1 TO 5
        READ val
        total = total + val
        PRINT val
    NEXT i
    PRINT "Total = "; total


DEC:
  category: data
  desc: "Decrements a variable by 1 (or by a specified amount)"
  usage: |
    DEC counter
    DEC x, 5

  example: |
    DIM n AS INTEGER
    n = 10
    DEC n
    PRINT n      ' 9
    DEC n, 4
    PRINT n      ' 5


DIM:
  category: data
  desc: "Declares a variable or array with an explicit type"
  usage: |
    DIM x AS INTEGER
    DIM name$ AS STRING
    DIM scores(10) AS INTEGER
    DIM matrix(3, 3) AS DOUBLE
    DIM items AS LIST OF INTEGER
    Do not use DIM for global variables that need to be SHARED inside SUBs/FUNCTIONs; use GLOBAL instead.
    Do not DIM FOR LOOP variables; FOR creates its own loop variable.

  example: |
    DIM name AS STRING
    DIM count AS INTEGER
    DIM pi AS DOUBLE

    name = "FasterBASIC"
    count = 42
    pi = 3.14159265358979

    PRINT name
    PRINT count
    PRINT pi

    ' Array:
    DIM scores(3) AS INTEGER
    scores(1) = 95 : scores(2) = 82 : scores(3) = 78
    FOR i = 1 TO 3
        PRINT scores(i)
    NEXT i


ERASE:
  category: data
  desc: "Deallocates a dynamic array"
  usage: |
    DIM arr(100) AS INTEGER
    ERASE arr

GLOBAL:
  category: data
  desc: "Declares a variable with global scope (accessible everywhere)"
  usage: |
    GLOBAL count AS INTEGER
    GLOBAL appName AS STRING

  example: |
    GLOBAL counter AS INTEGER

    SUB Increment()
        counter = counter + 1
    END SUB

    counter = 0
    Increment()
    Increment()
    Increment()
    PRINT counter    ' 3


INC:
  category: data
  desc: "Increments a variable by 1 (or by a specified amount)"
  usage: |
    INC counter
    INC x, 10

  example: |
    DIM n AS INTEGER
    n = 10
    INC n
    PRINT n      ' 11
    INC n, 4
    PRINT n      ' 15


LET:
  category: data
  desc: "Assigns a value to a variable (optional — assignment works without LET)"
  usage: |
    LET x = 42
    LET name$ = "Hello"
    x = 42

LOCAL:
  category: data
  desc: "Declares a variable with local scope inside a SUB/FUNCTION"
  usage: |
    SUB MyProc()
      LOCAL temp AS INTEGER
      temp = 42
    END SUB

PRESERVE:
  category: data
  desc: "Keeps existing data when resizing an array with REDIM"
  usage: |
    REDIM PRESERVE arr(200) AS INTEGER

READ:
  category: data
  desc: "Reads the next value from DATA statements"
  usage: |
    DATA 10, 20, 30
    READ a
    READ b
    READ c

  example: |
    DATA "Alice", 30, "Bob", 25, "Carol", 28
    DIM name AS STRING
    DIM age AS INTEGER
    FOR i = 1 TO 3
        READ name
        READ age
        PRINT name; " is "; age; " years old"
    NEXT i


REDIM:
  category: data
  desc: "Resizes a dynamic array at runtime"
  usage: |
    REDIM arr(new_size) AS INTEGER
    REDIM PRESERVE arr(new_size) AS INTEGER

  example: |
    DIM arr() AS INTEGER
    REDIM arr(5)
    PRINT "Initial size: "; SIZE(arr)
    REDIM PRESERVE arr(10)
    PRINT "New size: "; SIZE(arr)

RESTORE:
  category: data
  desc: "Resets the DATA pointer to the beginning (or to a label)"
  usage: |
    RESTORE
    RESTORE MyDataLabel

  example: |
    DATA 1, 2, 3
    DIM a AS INTEGER
    READ a : PRINT a    ' 1
    READ a : PRINT a    ' 2
    RESTORE
    READ a : PRINT a    ' 1 again


SHARED:
  category: data
  desc: "Makes a module-level variable accessible inside SUBs/FUNCTIONs"
  usage: |
    DIM count AS INTEGER
    SUB Increment()
      SHARED count
      count = count + 1
    END SUB

  example: |
    DIM count AS INTEGER
    SUB Update()
        SHARED count
        count = count + 1
    END SUB
    count = 0
    Update : Update
    PRINT "Final count: "; count

SWAP:
  category: data
  desc: "Exchanges the values of two variables"
  usage: |
    SWAP a, b

  example: |
    DIM a AS INTEGER
    DIM b AS INTEGER
    a = 10 : b = 20
    PRINT "Before: a="; a; " b="; b
    SWAP a, b
    PRINT "After:  a="; a; " b="; b


# ═══════════════════════════════════════════════════════════════════════════════
#  Type Names
# ═══════════════════════════════════════════════════════════════════════════════

BYTE:
  category: type
  desc: "8-bit unsigned integer type (0 to 255)"
  usage: |
    DIM b AS BYTE

  example: |
    DIM b AS BYTE = 255
    PRINT b

DOUBLE:
  category: type
  desc: "64-bit floating-point type"
  usage: |
    DIM d AS DOUBLE

  example: |
    DIM d AS DOUBLE = 3.1415926535
    PRINT d

COMPLEX:
  category: type
  desc: "Built-in complex number type (equivalent to TYPE Complex with Re/Im DOUBLE fields)"
  usage: |
    DIM z AS COMPLEX
    z = CMPLX(0.5, -1.25)
    PRINT REAL(z), IMAG(z)

  example: |
    DIM z AS COMPLEX = CMPLX(1.0, 2.0)
    PRINT z

INTEGER:
  category: type
  desc: "32-bit signed integer type"
  usage: |
    DIM n AS INTEGER

  example: |
    DIM i AS INTEGER = -100
    PRINT i

LONG:
  category: type
  desc: "64-bit signed integer type"
  usage: |
    DIM big AS LONG

  example: |
    DIM l AS LONG = 123456789012345
    PRINT l

SHORT:
  category: type
  desc: "16-bit signed integer type"
  usage: |
    DIM s AS SHORT

  example: |
    DIM s AS SHORT = 1000
    PRINT s

SINGLE:
  category: type
  desc: "32-bit floating-point type"
  usage: |
    DIM f AS SINGLE

  example: |
    DIM f AS SINGLE = 1.25
    PRINT f

STRING:
  category: type
  desc: "Variable-length text string type"
  usage: |
    DIM text AS STRING
    DIM greeting$ AS STRING

  example: |
    DIM s AS STRING = "FasterBASIC"
    PRINT s

UBYTE:
  category: type
  desc: "8-bit unsigned integer type (alias for BYTE)"
  usage: |
    DIM b AS UBYTE

  example: |
    DIM b AS UBYTE = 128
    PRINT b

UINTEGER:
  category: type
  desc: "32-bit unsigned integer type"
  usage: |
    DIM u AS UINTEGER

  example: |
    DIM u AS UINTEGER = 1000
    PRINT u

ULONG:
  category: type
  desc: "64-bit unsigned integer type"
  usage: |
    DIM big AS ULONG

  example: |
    DIM lu AS ULONG = 1000000000
    PRINT lu

USHORT:
  category: type
  desc: "16-bit unsigned integer type"
  usage: |
    DIM s AS USHORT

  example: |
    DIM us AS USHORT = 500
    PRINT us

HASHMAP:
  category: type
  desc: "Key-value dictionary collection type"
  usage: |
    DIM lookup AS HASHMAP
    lookup("alice") = 42

  example: |
    DIM scores AS HASHMAP
    scores("Alice") = 100
    PRINT scores("Alice")

LIST:
  category: type
  desc: "Dynamic ordered collection type"
  usage: |
    DIM items AS LIST OF INTEGER
    APPEND items, 42

  example: |
    DIM items AS LIST OF INTEGER
    APPEND items, 10
    APPEND items, 20
    PRINT SIZE(items)

MARSHALLED:
  category: type
  desc: "A type that can be serialised for inter-worker messaging"
  usage: |
    DIM data AS MARSHALLED

TYPEOF:
  category: type
  desc: "Returns the type name of a variable or expression at runtime"
  usage: |
    PRINT TYPEOF(x)

  example: |
    DIM n AS INTEGER
    DIM f AS DOUBLE
    DIM s AS STRING
    PRINT TYPEOF(n)     ' INTEGER
    PRINT TYPEOF(f)     ' DOUBLE
    PRINT TYPEOF(42.0)  ' DOUBLE

# ═══════════════════════════════════════════════════════════════════════════════
#  User-Defined Types & Classes
# ═══════════════════════════════════════════════════════════════════════════════

CLASS:
  category: oop
  desc: "Declares a class with methods, fields, constructor, and destructor"
  usage: |
    CLASS ClassName
      DIM field AS INTEGER
      CONSTRUCTOR(params)
        ME.field = value
      END CONSTRUCTOR
      DESTRUCTOR()
      END DESTRUCTOR
      METHOD DoSomething()
        statements
      END METHOD
    END CLASS
    CLASS Child EXTENDS Parent
      ' inherits Parent fields and methods
    END CLASS

  example: |
    CLASS Person
        DIM name AS STRING
        CONSTRUCTOR(n$)
            ME.name = n$
        END CONSTRUCTOR
        METHOD SayHello()
            PRINT "Hello, I am "; ME.name
        END METHOD
    END CLASS
    DIM p AS Person = NEW Person("Alice")
    p.SayHello()

CONSTRUCTOR:
  category: oop
  desc: "Declares the constructor for a CLASS (called on NEW)"
  usage: |
    CLASS MyClass
      CONSTRUCTOR(x AS INTEGER)
        ME.value = x
      END CONSTRUCTOR
    END CLASS

  example: |
    CLASS Point
        DIM x AS INTEGER
        DIM y AS INTEGER
        CONSTRUCTOR(newX, newY)
            ME.x = newX
            ME.y = newY
        END CONSTRUCTOR
    END CLASS
    DIM pt AS Point = NEW Point(10, 20)
    PRINT pt.x; ", "; pt.y

CREATE:
  category: oop
  desc: "Creates a new instance of a TYPE (value type construction)"
  usage: |
    DIM pt AS Vector2D
    pt = CREATE Vector2D

  example: |
    TYPE Vector
        x AS DOUBLE
        y AS DOUBLE
    END TYPE
    DIM v AS Vector = CREATE Vector
    v.x = 1.5 : v.y = 2.0
    PRINT v.x; v.y

DELETE:
  category: oop
  desc: "Destroys an object instance and calls its destructor"
  usage: |
    DELETE myObject

  example: |
    CLASS Resource
        DESTRUCTOR()
            PRINT "Resource freed"
        END DESTRUCTOR
    END CLASS
    DIM r AS Resource = NEW Resource()
    DELETE r

DESTRUCTOR:
  category: oop
  desc: "Declares the destructor for a CLASS (called on DELETE)"
  usage: |
    CLASS MyClass
      DESTRUCTOR()
        ' cleanup resources
      END DESTRUCTOR
    END CLASS

  example: |
    CLASS Log
        DESTRUCTOR()
            PRINT "Log object destroyed"
        END DESTRUCTOR
    END CLASS
    DIM l AS Log = NEW Log()
    DELETE l

ENDTYPE:
  category: oop
  desc: "Closes a TYPE block (alternative to END TYPE)"
  usage: |
    TYPE Vector2D
      x AS DOUBLE
      y AS DOUBLE
    ENDTYPE

  example: |
    TYPE TRect
        w AS INTEGER
        h AS INTEGER
    ENDTYPE
    DIM r AS TRect : r.w = 5 : r.h = 10
    PRINT r.w * r.h

EXTENDS:
  category: oop
  desc: "Specifies the parent class for inheritance"
  usage: |
    CLASS Dog EXTENDS Animal
      METHOD Speak()
        PRINT "Woof!"
      END METHOD
    END CLASS

  example: |
    CLASS Animal
        METHOD Speak() : PRINT "..." : END METHOD
    END CLASS
    CLASS Cat EXTENDS Animal
        METHOD Speak() : PRINT "Meow" : END METHOD
    END CLASS
    DIM c AS Cat = NEW Cat()
    c.Speak()

ME:
  category: oop
  desc: "Refers to the current object instance inside a METHOD/CONSTRUCTOR"
  usage: |
    METHOD SetName(n AS STRING)
      ME.name = n
    END METHOD

  example: |
    CLASS Counter
        DIM count AS INTEGER
        METHOD Set(n) : ME.count = n : END METHOD
        METHOD Get() AS INTEGER : Get = ME.count : END METHOD
    END CLASS
    DIM c AS Counter = NEW Counter()
    c.Set(42)
    PRINT c.Get()

METHOD:
  category: oop
  desc: "Declares a method inside a CLASS"
  usage: |
    CLASS MyClass
      METHOD Calculate(x AS INTEGER) AS INTEGER
        Calculate = x * 2
      END METHOD
    END CLASS

  example: |
    CLASS Calculator
        METHOD Add(a, b) AS INTEGER
            Add = a + b
        END METHOD
    END CLASS
    DIM c AS Calculator = NEW Calculator()
    PRINT c.Add(5, 7)

NEW:
  category: oop
  desc: "Creates a new instance of a CLASS"
  usage: |
    DIM obj AS MyClass
    obj = NEW MyClass(args)

NOTHING:
  category: oop
  desc: "Null reference value for object variables"
  usage: |
    DIM obj AS MyClass
    obj = NOTHING
    IF obj IS NOTHING THEN PRINT "no object"

  example: |
    DIM p AS Person = NOTHING
    IF p IS NOTHING THEN PRINT "Person is null"
    p = NEW Person("Bob")
    IF p ISNOT NOTHING THEN PRINT p.name

SUPER:
  category: oop
  desc: "Calls the parent class method or constructor from a subclass"
  usage: |
    CLASS Child EXTENDS Parent
      CONSTRUCTOR()
        SUPER()
      END CONSTRUCTOR
    END CLASS

  example: |
    CLASS Base
        CONSTRUCTOR() : PRINT "Base init" : END CONSTRUCTOR
    END CLASS
    CLASS Derived EXTENDS Base
        CONSTRUCTOR()
            SUPER()
            PRINT "Derived init"
        END CONSTRUCTOR
    END CLASS
    DIM d AS Derived = NEW Derived()

TYPE:
  category: oop
  desc: "Declares a user-defined value type (struct / record)"
  usage: |
    TYPE Vector2D
      x AS DOUBLE
      y AS DOUBLE
    END TYPE
    DIM pos AS Vector2D
    pos.x = 10.0
    pos.y = 20.0

  example: |
    TYPE Config
        id AS INTEGER
        active AS INTEGER
    END TYPE
    DIM cfg AS Config
    cfg.id = 1 : cfg.active = 1
    PRINT cfg.id; cfg.active

WITH:
  category: oop
  desc: "Opens a WITH block to access members of an object without repeating the variable name"
  usage: |
    WITH player
      .Name = "Alice"
      .Score = 100
      .Health = .Health - 10
    ENDWITH
    WITH enemies(i)
      .X = .X + .Speed
    ENDWITH
    WITH car.Engine

  example: |
    TYPE Point : x AS INTEGER : y AS INTEGER : END TYPE
    DIM pt AS Point
    WITH pt
        .x = 10 : .y = 20
    END WITH
    PRINT pt.x; pt.y
      .RPM = 3000
      .Temperature = 90.0
    ENDWITH

ENDWITH:
  category: oop
  desc: "Closes a WITH block"
  usage: |
    WITH player
      .Score = .Score + 10
    ENDWITH

# ═══════════════════════════════════════════════════════════════════════════════
#  Concurrency — Workers
# ═══════════════════════════════════════════════════════════════════════════════

AWAIT:
  category: worker
  desc: "Waits for a FUTURE to complete and retrieves its result"
  usage: |
    DIM f AS FUTURE
    f = SPAWN MyWorker
    result = AWAIT(f)

CANCEL:
  category: worker
  desc: "Sends a cancellation request to a running worker"
  usage: |
    CANCEL worker_id

CANCELLED:
  category: worker
  desc: "Checks whether the current worker has been cancelled"
  usage: |
    WORKER LongTask
      WHILE NOT CANCELLED
        ' do work
      WEND
    END WORKER

ENDWORKER:
  category: worker
  desc: "Closes a WORKER block (alternative to END WORKER)"
  usage: |
    WORKER MyWorker
      statements
    ENDWORKER

FUTURE:
  category: worker
  desc: "A handle representing the eventual result of a spawned worker"
  usage: |
    DIM f AS FUTURE
    f = SPAWN ComputeWorker
    result = AWAIT(f)

  example: |
    WORKER Calculator
        WAIT 5
        SEND PARENT, 42
    END WORKER
    DIM f AS FUTURE = SPAWN Calculator
    PRINT "Waiting for future..."
    PRINT "Result: "; AWAIT(f)

HASMESSAGE:
  category: worker
  desc: "Checks if there is a pending message from a worker"
  usage: |
    IF HASMESSAGE(worker_id) THEN
      msg = RECEIVE(worker_id)
    END IF

  example: |
    DIM w AS INTEGER = SPAWN Listener
    DO
        IF HASMESSAGE(w) THEN
            PRINT "Worker sent: "; RECEIVE(w)
            EXIT DO
        END IF
        WAIT 1
    LOOP

MARSHALL:
  category: worker
  desc: "Serialises data for safe transfer between workers"
  usage: |
    DIM data AS MARSHALLED
    MARSHALL data, myObject

  example: |
    TYPE Point : x AS INTEGER : y AS INTEGER : ENDTYPE
    DIM p AS Point : p.x = 10 : p.y = 20
    DIM m AS MARSHALLED
    MARSHALL m, p
    ' m can now be sent via SEND

PARENT:
  category: worker
  desc: "Refers to the parent (spawning) context in a worker, for SEND"
  usage: |
    WORKER MyWorker
      SEND PARENT, result
    END WORKER

  example: |
    WORKER Child
        SEND PARENT, "Report"
    END WORKER

READY:
  category: worker
  desc: "Checks if a spawned worker has finished execution"
  usage: |
    IF READY(worker_id) THEN
      result = RECEIVE(worker_id)
    END IF

  example: |
    DIM w AS INTEGER = SPAWN LongJob
    WHILE NOT READY(w) : WAIT 1 : WEND
    PRINT "Finished"

RECEIVE:
  category: worker
  desc: "Receives a message or result from a worker"
  usage: |
    msg = RECEIVE(worker_id)

  example: |
    DIM w AS INTEGER = SPAWN MyJob
    PRINT "Received: "; RECEIVE(w)

SEND:
  category: worker
  desc: "Sends a message to another worker or to PARENT"
  usage: |
    SEND worker_id, data
    SEND PARENT, result

  example: |
    DIM w AS INTEGER = SPAWN MyWorker
    SEND w, "Hello"

SPAWN:
  category: worker
  desc: "Launches a worker as a concurrent task; returns a worker ID"
  usage: |
    DIM w AS INTEGER
    w = SPAWN MyWorker
    w = SPAWN MyWorker(arg1, arg2)

  example: |
    WORKER Task(n)
        SEND PARENT, n * n
    END WORKER
    DIM w AS INTEGER = SPAWN Task(5)
    PRINT RECEIVE(w)

UNMARSHALL:
  category: worker
  desc: "Deserialises data received from a worker"
  usage: |
    DIM obj AS MyType
    UNMARSHALL obj, received_data

  example: |
    TYPE Data : val AS INTEGER : ENDTYPE
    DIM d AS Data
    ' Assume msg is MARSHALLED data from a worker
    UNMARSHALL d, msg
    PRINT d.val

WORKER:
  category: worker
  desc: "Declares a concurrent worker (runs in its own thread)"
  usage: |
    WORKER name
      statements
      SEND PARENT, result
    END WORKER
    WORKER ComputePi(precision AS INTEGER)
      DIM result AS DOUBLE
      ' compute...
      SEND PARENT, result
    END WORKER
    ' ── Related Guides ──
    ' articles/workers.md
    ' articles/introduction_voicescript.md
    ' articles/advanced_voicescript.md

  example: |
    WORKER MyWorker
        FOR i = 1 TO 3
            PRINT "Step "; i
            WAIT 1
        NEXT i
        SEND PARENT, "OK"
    END WORKER
    DIM w AS INTEGER = SPAWN MyWorker
    PRINT RECEIVE(w)

# ═══════════════════════════════════════════════════════════════════════════════
#  I/O — Print & Input
# ═══════════════════════════════════════════════════════════════════════════════

CONSOLE:
  category: io
  desc: "Directs output to the console / terminal"
  usage: |
    CONSOLE
    PRINT "This goes to the console"

INPUT:
  category: io
  desc: "Reads a line of text or value from the user"
  usage: |
    INPUT "Enter your name: "; name$
    INPUT x

PRINT:
  category: io
  desc: "Outputs text and values to the terminal"
  usage: |
    PRINT "Hello, World!"
    PRINT x; " + "; y; " = "; x + y
    PRINT USING "###.##"; value

  example: |
    PRINT "Hello, World!"
    DIM x AS INTEGER
    x = 42
    PRINT "The answer is "; x
    PRINT 6; " x "; 7; " = "; 6 * 7
    PRINT "Pi is about "; 3.14159
    ' PRINT with no arguments outputs a blank line:
    PRINT
    PRINT "Done."


USING:
  category: io
  desc: "Format specifier for PRINT USING"
  usage: |
    PRINT USING "###.##"; 3.14159
    PRINT USING "$$#,###.##"; amount

WRITE:
  category: io
  desc: "Outputs values separated by commas (data format)"
  usage: |
    WRITE x, y, z
    WRITE name$, age, score

  example: |
    DIM name AS STRING
    DIM age AS INTEGER
    name = "Alice"
    age = 30
    ' WRITE outputs comma-separated values:
    WRITE name, age, name & " is " & STR$(age)


# ═══════════════════════════════════════════════════════════════════════════════
#  File I/O
# ═══════════════════════════════════════════════════════════════════════════════

CLOSE:
  category: file_io
  desc: "Closes an open file"
  usage: |
    CLOSE #1

FIELD:
  category: file_io
  desc: "Defines the field layout for a random-access file record"
  usage: |
    FIELD #1, 20 AS name$, 4 AS age$

LOF:
  category: file_io
  desc: "Returns the length of an open file in bytes"
  usage: |
    length = LOF(1)

LSET:
  category: file_io
  desc: "Left-aligns a string in a fixed-length field variable"
  usage: |
    LSET field$ = value$

OPEN:
  category: file_io
  desc: "Opens a file for reading, writing, or appending"
  usage: |
    OPEN "data.txt" FOR INPUT AS #1
    OPEN "out.txt" FOR OUTPUT AS #2
    OPEN "log.txt" FOR APPEND AS #3
    OPEN "data.bin" FOR RANDOM AS #4

PUT:
  category: file_io
  desc: "Writes a record to a random-access file"
  usage: |
    PUT #1, record_number

RSET:
  category: file_io
  desc: "Right-aligns a string in a fixed-length field variable"
  usage: |
    RSET field$ = value$

SEEK:
  category: file_io
  desc: "Moves the file pointer to a specific position"
  usage: |
    SEEK #1, position

SLURP:
  category: file_io
  desc: "Reads an entire file into a string variable"
  usage: |
    content$ = SLURP("filename.txt")

  example: |
    SPIT "hello.txt", "Welcome to Ed-BASIC!"
    DIM content AS STRING
    content = SLURP("hello.txt")
    PRINT content

SPIT:
  category: file_io
  desc: "Writes a string to a file, replacing its contents"
  usage: |
    SPIT "output.txt", content$

  example: |
    SPIT "test.log", "Final Status: OK"
    PRINT SLURP("test.log")

# ═══════════════════════════════════════════════════════════════════════════════
#  String Functions
# ═══════════════════════════════════════════════════════════════════════════════

LCASE$:
  category: string
  desc: "Converts a string to lowercase"
  usage: |
    result$ = LCASE$("HELLO")   ' returns "hello"

  example: |
    PRINT LCASE$("HELLO WORLD")   ' hello world
    PRINT LCASE$("FasterBASIC")   ' fasterbasic


LEFT$:
  category: string
  desc: "Returns the leftmost n characters of a string"
  usage: |
    result$ = LEFT$("Hello", 3)   ' returns "Hel"

  example: |
    DIM s AS STRING
    s = "FasterBASIC"
    PRINT LEFT$(s, 6)    ' Faster
    PRINT LEFT$(s, 1)    ' F


MID$:
  category: string
  desc: "Returns or replaces a substring starting at a given position"
  usage: |
    result$ = MID$("Hello World", 7, 5)   ' returns "World"
    MID$(text$, 3, 2) = "XY"

  example: |
    DIM s AS STRING
    s = "Hello, World!"
    PRINT MID$(s, 8, 5)      ' World
    PRINT MID$(s, 1, 5)      ' Hello
    ' Replace a substring in-place:
    MID$(s, 8, 5) = "BASIC"
    PRINT s                  ' Hello, BASIC!


RIGHT$:
  category: string
  desc: "Returns the rightmost n characters of a string"
  usage: |
    result$ = RIGHT$("Hello", 3)   ' returns "llo"

  example: |
    DIM s AS STRING
    s = "FasterBASIC"
    PRINT RIGHT$(s, 5)   ' BASIC
    PRINT RIGHT$(s, 1)   ' C


CENTER$:
  category: string
  desc: "Centers a string in a field width using an optional pad string"
  usage: |
    result$ = CENTER$(text$, width)
    result$ = CENTER$(text$, width, pad$)

  example: |
    PRINT "[" & CENTER$("HE", 6) & "]"          ' [  HE  ]
    PRINT "[" & CENTER$("HE", 6, "-") & "]"      ' [--HE--]

DELETE$:
  category: string
  desc: "Deletes a substring by 1-based position and length"
  usage: |
    result$ = DELETE$(text$, pos, len)

  example: |
    PRINT DELETE$("abcdef", 3, 2)   ' abef (deleted "cd")

EXTRACT$:
  category: string
  desc: "Extracts a substring using inclusive 1-based start and end"
  usage: |
    result$ = EXTRACT$(text$, startPos, endPos)

  example: |
    PRINT EXTRACT$("abcdef", 2, 4)  ' bcd

INSERT$:
  category: string
  desc: "Inserts text at a 1-based position"
  usage: |
    result$ = INSERT$(text$, pos, insert$)

  example: |
    PRINT INSERT$("abc", 2, "XX")   ' aXXbc

INSTRREV:
  category: string
  desc: "Finds a substring from right to left (returns 1-based position or 0)"
  usage: |
    pos = INSTRREV(haystack$, needle$)
    pos = INSTRREV(startPos, haystack$, needle$)

  example: |
    PRINT INSTRREV("banana", "na")          ' 5
    PRINT INSTRREV("banana", "na", 4)       ' 3

LPAD$:
  category: string
  desc: "Left-pads a string to a width using an optional pad string"
  usage: |
    result$ = LPAD$(text$, width)
    result$ = LPAD$(text$, width, pad$)

  example: |
    PRINT LPAD$("42", 4, "0")       ' 0042
    PRINT LPAD$("test", 10)         '       test (padded with spaces)

REMOVE$:
  category: string
  desc: "Removes all occurrences of a pattern from a string"
  usage: |
    result$ = REMOVE$(text$, pattern$)

  example: |
    PRINT REMOVE$("cat,mat,rat", "at")      ' c,m,r

REPEAT$:
  category: string
  desc: "Repeats a string pattern count times"
  usage: |
    result$ = REPEAT$(pattern$, count)

  example: |
    PRINT REPEAT$("*", 10)          ' **********

REPLACE$:
  category: string
  desc: "Replaces all occurrences of one substring with another"
  usage: |
    result$ = REPLACE$(text$, old$, new$)

  example: |
    PRINT REPLACE$("I love dogs", "dogs", "cats")   ' I love cats

REVERSE$:
  category: string
  desc: "Returns the input string with characters reversed"
  usage: |
    result$ = REVERSE$(text$)

  example: |
    PRINT REVERSE$("racecar")      ' racecar
    PRINT REVERSE$("FasterBASIC")  ' CISABretsaF

RPAD$:
  category: string
  desc: "Right-pads a string to a width using an optional pad string"
  usage: |
    result$ = RPAD$(text$, width)
    result$ = RPAD$(text$, width, pad$)

  example: |
    PRINT "[" & RPAD$("HE", 6, ".") & "]"      ' [HE....]

TALLY:
  category: string
  desc: "Counts non-overlapping occurrences of a pattern in a string"
  usage: |
    n = TALLY(text$, pattern$)

  example: |
    PRINT TALLY("abracadabra", "a")      ' 5
    PRINT TALLY("aaaaa", "aa")           ' 2


UCASE$:
  category: string
  desc: "Converts a string to uppercase"
  usage: |
    result$ = UCASE$("hello")   ' returns "HELLO"

  example: |
    PRINT UCASE$("hello world")   ' HELLO WORLD
    PRINT UCASE$("FasterBASIC")   ' FASTERBASIC


# ═══════════════════════════════════════════════════════════════════════════════
#  Operators
# ═══════════════════════════════════════════════════════════════════════════════

AND:
  category: operator
  desc: "Logical AND with short-circuit evaluation (returns 0 or 1)"
  usage: |
    IF a > 0 AND b > 0 THEN PRINT "both positive"
    IF obj <> NOTHING AND obj.Health > 0 THEN PRINT "alive"

  example: |
    DIM a AS INTEGER
    DIM b AS INTEGER
    a = 5 : b = 10
    IF a > 0 AND b > 0 THEN PRINT "both positive"
    IF a > 3 AND b < 5 THEN PRINT "a>3 and b<5"   ' not printed
    PRINT (1 = 1) AND (2 = 2)    ' 1 (true)
    PRINT (1 = 1) AND (2 = 3)    ' 0 (false)


ANDALSO:
  category: operator
  desc: "Alias for AND — logical AND with short-circuit evaluation"
  usage: |
    IF a > 0 ANDALSO b > 0 THEN PRINT "both positive"

  example: |
    DIM a AS INTEGER = 10
    DIM b AS INTEGER = 20
    IF a > 5 ANDALSO b > 15 THEN PRINT "Both conditions met"

BAND:
  category: operator
  desc: "Bitwise AND operator"
  usage: |
    result = mask BAND &HFF
    lowBits = value BAND &H0F

  example: |
    PRINT 12 BAND 10     ' 8  (1100 AND 1010 = 1000)
    PRINT 255 BAND 15    ' 15 (low nibble mask)
    PRINT 7 BAND 5       ' 5  (111 AND 101 = 101)


BNOT:
  category: operator
  desc: "Bitwise NOT (one's complement) — flips all bits"
  usage: |
    inverted = BNOT mask
    result = BNOT &HFF   ' all bits flipped

  example: |
    PRINT HEX$(BNOT 0)      ' FFFFFFFFFFFFFFFF
    PRINT BNOT 1            ' -2 (two's complement of 1 is -2)
    PRINT BNOT -1           ' 0

BOR:
  category: operator
  desc: "Bitwise OR operator"
  usage: |
    flags = flags BOR &H80
    combined = a BOR b

  example: |
    PRINT 12 BOR 3      ' 15 (1100 OR 0011 = 1111)
    PRINT 8 BOR 4       ' 12
    PRINT 1 BOR 2       ' 3


BXOR:
  category: operator
  desc: "Bitwise exclusive OR operator"
  usage: |
    flags = flags BXOR toggle_mask
    swapped = a BXOR b

  example: |
    PRINT 12 BXOR 10    ' 6  (1100 XOR 1010 = 0110)
    PRINT 15 BXOR 9     ' 6  (1111 XOR 1001 = 0110)
    ' Simple toggle bit pattern:
    DIM flags AS INTEGER
    flags = 0
    flags = flags BXOR 1   ' set bit 0
    PRINT flags             ' 1
    flags = flags BXOR 1   ' clear bit 0
    PRINT flags             ' 0


EQV:
  category: operator
  desc: "Logical equivalence operator (true when both operands are equal)"
  usage: |
    result = a EQV b

  example: |
    PRINT (1 = 1) EQV (2 = 2)    ' 1 (True)
    PRINT (1 = 1) EQV (2 = 3)    ' 0 (False)
    PRINT (1 = 0) EQV (2 = 3)    ' 1 (True)

IMP:
  category: operator
  desc: "Logical implication operator"
  usage: |
    result = a IMP b

  example: |
    PRINT 1 IMP 1    ' 1
    PRINT 1 IMP 0    ' 0
    PRINT 0 IMP 1    ' 1
    PRINT 0 IMP 0    ' 1

MOD:
  category: operator
  desc: "Integer modulo (remainder) operator"
  usage: |
    remainder = 17 MOD 5   ' returns 2
    IF n MOD 2 = 0 THEN PRINT "even"

  example: |
    PRINT 17 MOD 5    ' 2
    PRINT 10 MOD 3    ' 1
    PRINT 20 MOD 4    ' 0
    ' Check even / odd:
    FOR i = 1 TO 6
        IF i MOD 2 = 0 THEN
            PRINT i; " is even"
        ELSE
            PRINT i; " is odd"
        END IF
    NEXT i


NOT:
  category: operator
  desc: "Logical NOT operator (returns 1 if operand is 0, else 0)"
  usage: |
    IF NOT done THEN PRINT "still working"
    IF NOT (a > 5) THEN PRINT "a is 5 or less"

  example: |
    DIM done AS INTEGER
    done = 0
    IF NOT done THEN PRINT "still running"
    done = 1
    IF NOT done THEN PRINT "still running"   ' not printed
    PRINT NOT 0    ' 1
    PRINT NOT 1    ' 0


OR:
  category: operator
  desc: "Logical OR with short-circuit evaluation (returns 0 or 1)"
  usage: |
    IF a = 1 OR b = 1 THEN PRINT "at least one"
    IF ptr = NOTHING OR NOT ready THEN EXIT SUB

  example: |
    DIM a AS INTEGER
    DIM b AS INTEGER
    a = 0 : b = 5
    IF a > 0 OR b > 0 THEN PRINT "at least one positive"
    PRINT (1 = 2) OR (3 = 3)    ' 1 (true)
    PRINT (1 = 2) OR (2 = 3)    ' 0 (false)


ORELSE:
  category: operator
  desc: "Alias for OR — logical OR with short-circuit evaluation"
  usage: |
    IF a = 1 ORELSE b = 1 THEN PRINT "at least one"

  example: |
    DIM status AS INTEGER = 0
    IF status = 0 ORELSE status = 1 THEN PRINT "Valid state"

XOR:
  category: operator
  desc: "Logical exclusive OR (returns 0 or 1)"
  usage: |
    result = a XOR b
    IF flag1 XOR flag2 THEN PRINT "exactly one is true"

  example: |
    PRINT (1 = 1) XOR (2 = 3)    ' 1 (True)
    PRINT (1 = 1) XOR (2 = 2)    ' 0 (False)
    PRINT (1 = 0) XOR (2 = 3)    ' 0 (False)

# ═══════════════════════════════════════════════════════════════════════════════
#  HashMap Operations
# ═══════════════════════════════════════════════════════════════════════════════

HASKEY:
  category: hashmap
  desc: "Checks whether a key exists in a HASHMAP"
  usage: |
    IF HASKEY(myMap, "name") THEN
      PRINT myMap("name")
    END IF

  example: |
    DIM ages AS HASHMAP
    ages("Alice") = 30
    ages("Bob")   = 25
    IF HASKEY(ages, "Alice") THEN
        PRINT "Alice is "; ages("Alice")
    END IF
    IF NOT HASKEY(ages, "Carol") THEN
        PRINT "Carol not found"
    END IF


KEYS:
  category: hashmap
  desc: "Returns a LIST of all keys in a HASHMAP"
  usage: |
    DIM k AS LIST OF STRING
    k = KEYS(myMap)

  example: |
    DIM scores AS HASHMAP
    scores("Alice") = 95
    scores("Bob")   = 82
    DIM k AS LIST OF STRING
    k = KEYS(scores)
    PRINT LENGTH(k)    ' 2
    FOR EACH name$ IN k
        PRINT name$; " -> "; scores(name$)
    NEXT name$


# ═══════════════════════════════════════════════════════════════════════════════
#  List / Collection Operations
# ═══════════════════════════════════════════════════════════════════════════════

APPEND:
  category: collection
  desc: "Adds an element to the end of a LIST"
  usage: |
    APPEND myList, value

  example: |
    DIM nums AS LIST OF INTEGER
    nums.APPEND(10)
    nums.APPEND(20)
    nums.APPEND(30)
    PRINT LENGTH(nums)    ' 3
    FOR EACH n IN nums
        PRINT n
    NEXT n


CONTAINS:
  category: collection
  desc: "Checks whether a LIST contains a given value"
  usage: |
    IF CONTAINS(myList, value) THEN PRINT "found"

  example: |
    DIM fruits AS LIST OF STRING
    fruits.APPEND("apple")
    fruits.APPEND("banana")
    fruits.APPEND("cherry")
    PRINT CONTAINS(fruits, "banana")   ' 1 (true)
    PRINT CONTAINS(fruits, "grape")    ' 0 (false)


COPY:
  category: collection
  desc: "Creates a shallow copy of a LIST"
  usage: |
    DIM copy AS LIST OF INTEGER
    copy = COPY(original)

  example: |
    DIM original AS LIST OF INTEGER
    original.APPEND(10) : original.APPEND(20) : original.APPEND(30)
    DIM copy AS LIST OF INTEGER
    copy = COPY(original)
    copy.POP()
    PRINT LENGTH(original)    ' 3 (unchanged)
    PRINT LENGTH(copy)        ' 2


EMPTY:
  category: collection
  desc: "Checks whether a LIST or HASHMAP has no elements"
  usage: |
    IF EMPTY(myList) THEN PRINT "no items"

  example: |
    DIM nums AS LIST OF INTEGER
    PRINT EMPTY(nums)    ' 1 (true — nothing in it yet)
    nums.APPEND(42)
    PRINT EMPTY(nums)    ' 0 (false)
    nums.POP()
    PRINT EMPTY(nums)    ' 1 again


EXTEND:
  category: collection
  desc: "Appends all elements from one LIST onto another"
  usage: |
    EXTEND targetList, sourceList

  example: |
    DIM a AS LIST OF INTEGER
    DIM b AS LIST OF INTEGER
    a.APPEND(1) : a.APPEND(2)
    b.APPEND(3) : b.APPEND(4)
    a.EXTEND(b)
    PRINT LENGTH(a)    ' 4
    FOR EACH n IN a
        PRINT n    ' 1, 2, 3, 4
    NEXT n


GET:
  category: collection
  desc: "Retrieves an element from a LIST by index"
  usage: |
    value = GET(myList, index)

HEAD:
  category: collection
  desc: "Returns the first element of a LIST"
  usage: |
    first = HEAD(myList)

  example: |
    DIM nums AS LIST OF INTEGER
    nums.APPEND(42)
    nums.APPEND(7)
    nums.APPEND(99)
    PRINT HEAD(nums)    ' 42 (first element)


INDEXOF:
  category: collection
  desc: "Returns the index of the first occurrence of a value in a LIST"
  usage: |
    pos = INDEXOF(myList, value)

  example: |
    DIM nums AS LIST OF INTEGER
    nums.APPEND(10)
    nums.APPEND(20)
    nums.APPEND(30)
    PRINT INDEXOF(nums, 20)    ' 2 (1-based index)
    PRINT INDEXOF(nums, 99)    ' 0 (not found)


INSERT:
  category: collection
  desc: "Inserts an element at a specific position in a LIST"
  usage: |
    INSERT myList, index, value

JOIN:
  category: collection
  desc: "Joins all elements of a LIST into a single string with a separator"
  usage: |
    result$ = JOIN(myList, ", ")

  example: |
    DIM words AS LIST OF STRING
    words.APPEND("Hello")
    words.APPEND("FasterBASIC")
    words.APPEND("World")
    PRINT JOIN(words, ", ")    ' Hello, FasterBASIC, World
    PRINT JOIN(words, " | ")   ' Hello | FasterBASIC | World


LENGTH:
  category: collection
  desc: "Returns the number of elements in a LIST or HASHMAP"
  usage: |
    n = LENGTH(myList)

  example: |
    DIM items AS LIST OF STRING
    items.APPEND("a")
    items.APPEND("b")
    items.APPEND("c")
    PRINT LENGTH(items)    ' 3
    items.POP()
    PRINT LENGTH(items)    ' 2


POP:
  category: collection
  desc: "Removes and returns the last element of a LIST"
  usage: |
    value = POP(myList)

  example: |
    DIM nums AS LIST OF INTEGER
    nums.APPEND(10)
    nums.APPEND(20)
    nums.APPEND(30)
    DIM last AS INTEGER
    last = nums.POP()
    PRINT last            ' 30
    PRINT LENGTH(nums)    ' 2


PREPEND:
  category: collection
  desc: "Adds an element to the beginning of a LIST"
  usage: |
    PREPEND myList, value

  example: |
    DIM words AS LIST OF STRING
    words.APPEND("world")
    words.PREPEND("hello")
    PRINT HEAD(words)    ' hello
    PRINT TAIL(words)    ' world


REMOVE:
  category: collection
  desc: "Removes an element from a LIST or key from a HASHMAP"
  usage: |
    REMOVE myList, index
    REMOVE myMap, "key"

REST:
  category: collection
  desc: "Returns a LIST containing all elements except the first"
  usage: |
    tail = REST(myList)

  example: |
    DIM nums AS LIST OF INTEGER
    nums.APPEND(10) : nums.APPEND(20) : nums.APPEND(30)
    DIM tail AS LIST OF INTEGER
    tail = REST(nums)
    PRINT LENGTH(tail)      ' 2
    PRINT HEAD(tail)        ' 20


REVERSE:
  category: collection
  desc: "Reverses the order of elements in a LIST"
  usage: |
    REVERSE myList

  example: |
    DIM nums AS LIST OF INTEGER
    nums.APPEND(1)
    nums.APPEND(2)
    nums.APPEND(3)
    nums.REVERSE()
    FOR EACH n IN nums
        PRINT n    ' 3, 2, 1
    NEXT n


SHIFT:
  category: collection
  desc: "Removes and returns the first element of a LIST"
  usage: |
    value = SHIFT(myList)

  example: |
    DIM nums AS LIST OF INTEGER
    nums.APPEND(10)
    nums.APPEND(20)
    nums.APPEND(30)
    DIM first AS INTEGER
    first = nums.SHIFT()
    PRINT first           ' 10
    PRINT LENGTH(nums)    ' 2
    PRINT HEAD(nums)      ' 20


SIZE:
  category: collection
  desc: "Returns the number of elements in a LIST or HASHMAP"
  usage: |
    n = SIZE(myMap)

SORT:
  category: collection
  desc: "Sorts a LIST in-place. Accepts optional ASCENDING (default) or DESCENDING keyword"
  usage: |
    myList.SORT()               ' ascending (default)
    myList.SORT(DESCENDING)     ' highest first
    myList.SORT(ASCENDING)      ' explicit ascending
    ' Works on LIST OF INTEGER, LIST OF DOUBLE, LIST OF STRING:
    DIM nums AS LIST OF INTEGER = LIST(5, 3, 8, 1, 9)
    nums.SORT()
    PRINT nums.HEAD()           ' 1
    nums.SORT(DESCENDING)
    PRINT nums.HEAD()           ' 9

  example: |
    DIM nums AS LIST OF INTEGER
    nums.APPEND(5)
    nums.APPEND(2)
    nums.APPEND(8)
    nums.APPEND(1)
    nums.SORT()
    FOR EACH n IN nums
        PRINT n    ' 1, 2, 5, 8
    NEXT n
    nums.SORT(DESCENDING)
    PRINT HEAD(nums)    ' 8


SORTED:
  category: collection
  desc: "Returns a new sorted LIST, leaving the original unchanged. Accepts optional ASCENDING (default) or DESCENDING keyword"
  usage: |
    DIM copy AS LIST OF INTEGER
    LET copy = myList.SORTED()              ' ascending copy
    LET copy = myList.SORTED(DESCENDING)    ' descending copy
    ' Original is untouched:
    DIM original AS LIST OF STRING = LIST("banana", "apple", "cherry")
    DIM sorted AS LIST OF STRING
    LET sorted = original.SORTED()
    PRINT original.HEAD()    ' banana
    PRINT sorted.HEAD()      ' apple

  example: |
    DIM original AS LIST OF STRING
    original.APPEND("banana")
    original.APPEND("apple")
    original.APPEND("cherry")
    DIM copy AS LIST OF STRING
    copy = original.SORTED()
    PRINT HEAD(original)    ' banana  (original unchanged)
    PRINT HEAD(copy)        ' apple   (sorted copy)


TAIL:
  category: collection
  desc: "Returns the last element of a LIST"
  usage: |
    last = TAIL(myList)

  example: |
    DIM nums AS LIST OF INTEGER
    nums.APPEND(42)
    nums.APPEND(7)
    nums.APPEND(99)
    PRINT TAIL(nums)    ' 99 (last element)


CLEAR:
  category: collection
  desc: "Removes all elements from a LIST or HASHMAP"
  usage: |
    CLEAR myList
    CLEAR myMap

  example: |
    DIM nums AS LIST OF INTEGER
    nums.APPEND(1) : nums.APPEND(2) : nums.APPEND(3)
    PRINT LENGTH(nums)    ' 3
    nums.CLEAR()
    PRINT LENGTH(nums)    ' 0
    PRINT EMPTY(nums)     ' 1


ASCENDING:
  category: collection
  desc: "Sort-direction keyword — specifies ascending order (lowest first). This is the default for SORT, SORTED, QSORT, and INDEX and may be omitted"
  usage: |
    myList.SORT(ASCENDING)
    QSORT(a(), ASCENDING)
    INDEX(src(), dst(), ASCENDING)

DESCENDING:
  category: collection
  desc: "Sort-direction keyword — specifies descending order (highest first) for SORT, SORTED, QSORT, and INDEX"
  usage: |
    myList.SORT(DESCENDING)
    LET copy = myList.SORTED(DESCENDING)
    QSORT(a(), DESCENDING)
    INDEX(src(), dst(), DESCENDING)

