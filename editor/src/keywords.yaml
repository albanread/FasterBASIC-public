    GWAIT

SCREEN:
  category: graphics_screen
  desc: "Opens a retro graphics window with specified dimensions and mode"
  usage: |
    SCREEN width, height
    SCREEN width, height, mode
    SCREEN 320, 240, 8

SCREENACTIVE:
  category: graphics_screen
  desc: "Sets which screen is the active drawing target"
  usage: |
    SCREENACTIVE screen_id

SCREENCLOSE:
  category: graphics_screen
  desc: "Closes a graphics screen window"
  usage: |
    SCREENCLOSE
