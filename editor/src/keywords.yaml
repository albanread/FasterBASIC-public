#  Compiler Directives
# ═══════════════════════════════════════════════════════════════════════════════

INCLUDE:
  category: directive
  desc: "Includes another source file into the current compilation"
  usage: |
    INCLUDE "utils.bas"
    INCLUDE ONCE "header.bas"

REM:
  category: directive
  desc: "Comment — remainder of the line is ignored by the compiler"
  usage: |
    REM This is a comment
    ' This is also a comment

# ═══════════════════════════════════════════════════════════════════════════════
#  Terminal / Screen — General
# ═══════════════════════════════════════════════════════════════════════════════

AT:
  category: terminal
  desc: "Positions the cursor at a specific column on the current line"
  usage: |
    PRINT AT 20; "Hello"

CLS:
  category: terminal
  desc: "Clears the terminal screen"
  usage: |
    CLS

  example: |
    PRINT "This will be cleared..."
    CLS
    PRINT "Screen cleared!"


COLOR:
  category: terminal
  desc: "Sets the foreground and background text colours"
  usage: |
    COLOR foreground
    COLOR foreground, background

  example: |
    COLOR 2    ' green text
    PRINT "Green text"
    COLOR 4    ' red text
    PRINT "Red text"
    COLOR_RESET
    PRINT "Normal text"


COLOUR:
  category: terminal
  desc: "Sets the foreground and background text colours (UK spelling)"
  usage: |
    COLOUR foreground
    COLOUR foreground, background

LOCATE:
  category: terminal
  desc: "Moves the cursor to a specific row and column"
  usage: |
    LOCATE row, col
    LOCATE 10, 20

  example: |
    CLS
    LOCATE 5, 10
    PRINT "Positioned text"
    LOCATE 10, 1
    PRINT "Line 10, column 1"


POS:
  category: terminal
  desc: "Returns the current cursor column position"
  usage: |
    col = POS

ROW:
  category: terminal
  desc: "Returns the current cursor row position"
  usage: |
    r = ROW

WAIT:
  category: terminal
  desc: "Pauses execution for a number of centiseconds"
  usage: |
    WAIT 100    ' wait 1 second (100 centiseconds)

  example: |
    PRINT "Pause for 1 second..."
    WAIT 100
    PRINT "Done"

SLEEP_DEPRECATED:
  category: terminal
  desc: "Pauses execution for a specified duration"
  usage: |
    WAIT 100
    WAIT 200

  example: |
    PRINT "Starting..."
    WAIT 50    ' wait 500 milliseconds
    PRINT "500ms later"
    WAIT 100
    PRINT "1 second later"


CSRLIN:
  category: terminal
  desc: "Returns the current cursor row (line) position"
  usage: |
    row = CSRLIN

COLOR_RESET:
  category: terminal
  desc: "Resets all terminal colour and style attributes to defaults"
  usage: |
    COLOR_RESET

SCREEN_ALTERNATE:
  category: terminal
  desc: "Switches to the alternate terminal screen buffer"
  usage: |
    SCREEN_ALTERNATE
    ' draw UI in alternate buffer
    SCREEN_MAIN

SCREEN_MAIN:
  category: terminal
  desc: "Switches back to the main terminal screen buffer"
  usage: |
    SCREEN_ALTERNATE
    ' work in alternate buffer
    SCREEN_MAIN     ' restore original screen

WRCH:
  category: terminal
  desc: "Writes a single raw byte/character to the terminal"
  usage: |
    WRCH 27        ' ESC character
    WRCH 65        ' letter A

WRSTR:
  category: terminal
  desc: "Writes a raw string to the terminal without newline"
  usage: |
    WRSTR "Hello"
    WRSTR escape_sequence$

WAIT_MS:
  category: terminal
  desc: "Pauses execution for a specified number of milliseconds"
  usage: |
    WAIT_MS 500    ' wait half a second
    WAIT_MS delay

  example: |
    PRINT "Milliseconds starting..."
    WAIT_MS 250
    PRINT "250ms elapsed"

# ═══════════════════════════════════════════════════════════════════════════════
#  Terminal — VDU Output
# ═══════════════════════════════════════════════════════════════════════════════

VDUCLS:
  category: vdu
  desc: "Clears the VDU terminal screen"
  usage: |
    VDUCLS

  example: |
    VDUCLS
    PRINT "Screen cleared"

VDUCOLOR:
  category: vdu
  desc: "Sets VDU text colour by index"
  usage: |
    VDUCOLOR index

  example: |
    VDUCOLOR 1    ' Usually red or blue depending on palette
    PRINT "Colored text"

VDUCOLOUR:
  category: vdu
  desc: "Sets VDU text colour by index (UK spelling)"
  usage: |
    VDUCOLOUR index

  example: |
    VDUCOLOUR 2
    PRINT "UK style color"

VDUCURSOR:
  category: vdu
  desc: "Sets the VDU cursor visibility or shape"
  usage: |
    VDUCURSOR ON
    VDUCURSOR OFF

  example: |
    VDUCURSOR OFF
    WAIT 100
    VDUCURSOR ON

VDUDOWN:
  category: vdu
  desc: "Moves the VDU cursor down one row"
  usage: |
    VDUDOWN

  example: |
    PRINT "Top"
    VDUDOWN
    PRINT "Bottom"

VDUEOL:
  category: vdu
  desc: "Clears from the VDU cursor position to the end of the line"
  usage: |
    VDUEOL

  example: |
    PRINT "Long line of text";
    VDUMOVE CSRLIN, 5
    VDUEOL

VDUEOS:
  category: vdu
  desc: "Clears from the VDU cursor position to the end of the screen"
  usage: |
    VDUEOS

  example: |
    VDUMOVE 15, 0
    VDUEOS

VDUHEIGHT:
  category: vdu
  desc: "Returns the height of the VDU terminal in rows"
  usage: |
    h = VDUHEIGHT

  example: |
    PRINT "VDU Rows: "; VDUHEIGHT

VDULEFT:
  category: vdu
  desc: "Moves the VDU cursor left one column"
  usage: |
    VDULEFT

  example: |
    PRINT "Text"
    VDULEFT : VDULEFT
    PRINT "!!"

VDUMOVE:
  category: vdu
  desc: "Moves the VDU cursor to a specific row and column"
  usage: |
    VDUMOVE row, col

  example: |
    VDUCLS
    VDUMOVE 10, 10
    PRINT "Centerish"

VDUPOS:
  category: vdu
  desc: "Returns the current VDU cursor position"
  usage: |
    VDUPOS

  example: |
    PRINT "VDU cursor at: "; VDUPOSX; ", "; VDUPOSY

VDUPOSX:
  category: vdu
  desc: "Returns the current VDU cursor column (x position)"
  usage: |
    x = VDUPOSX

  example: |
    PRINT "Current column: "; VDUPOSX

VDUPOSY:
  category: vdu
  desc: "Returns the current VDU cursor row (y position)"
  usage: |
    y = VDUPOSY

  example: |
    PRINT "Current row: "; VDUPOSY

VDURESET:
  category: vdu
  desc: "Resets VDU terminal attributes to defaults"
  usage: |
    VDURESET

  example: |
    VDURGB 255, 0, 0
    PRINT "Red"
    VDURESET
    PRINT "Normal"

VDURIGHT:
  category: vdu
  desc: "Moves the VDU cursor right one column"
  usage: |
    VDURIGHT

  example: |
    VDURIGHT : VDURIGHT
    PRINT "Offset"

VDURGB:
  category: vdu
  desc: "Sets VDU text colour using RGB values"
  usage: |
    VDURGB r, g, b

  example: |
    VDURGB 100, 200, 255
    PRINT "Vibrant colors"

VDUSCREEN:
  category: vdu
  desc: "Switches between VDU screen buffers"
  usage: |
    VDUSCREEN buffer_id

  example: |
    VDUSCREEN 1  ' Alternate buffer
    PRINT "Alt screen"
    WAIT 100
    VDUSCREEN 0  ' Main buffer

VDUSIZE:
  category: vdu
  desc: "Returns the VDU terminal dimensions (width, height)"
  usage: |
    VDUSIZE

  example: |
    PRINT "VDU Dimensions: "; VDUWIDTH; "x"; VDUHEIGHT

VDUSTYLE:
  category: vdu
  desc: "Sets VDU text style attributes (bold, italic, etc.)"
  usage: |
    VDUSTYLE style_mask

  example: |
    VDUSTYLE 1  ' Bold
    PRINT "Bold VDU"
    VDURESET
    VDUSTYLE style_flags

VDUUP:
  category: vdu
  desc: "Moves the VDU cursor up one row"
  usage: |
    VDUUP

  example: |
    PRINT "Line 2"
    VDUUP
    PRINT "Line 1 (overwritten)"

VDUWIDTH:
  category: vdu
  desc: "Returns the width of the VDU terminal in columns"
  usage: |
    w = VDUWIDTH

  example: |
    PRINT "VDU Width: "; VDUWIDTH; " columns"

