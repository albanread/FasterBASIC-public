# ═══════════════════════════════════════════════════════════════════════════════
#  Audio
# ═══════════════════════════════════════════════════════════════════════════════

PLAY:
  category: audio
  desc: "Plays a sound or music file"
  usage: |
    PLAY "music.mp3"
    PLAY "sound.wav", volume
    PLAY channel, "effect.wav"

  example: |
    ' Play a wave file (requires file in assets or same folder)
    PLAY "success.wav"
    WAIT 50

SOUND:
  category: audio
  desc: "Sound subsystem — create, play, and manage sound effects"
  usage: |
    ' ── Predefined game SFX (returns slot ID) ──
    SOUND BEEP slot, frequency, duration
    SOUND ZAP slot, frequency, duration
    SOUND EXPLODE slot, size, duration
    SOUND BIGEXPLODE slot, size, duration
    SOUND SMALLEXPLODE slot, intensity, duration
    SOUND DISTANTEXPLODE slot, distance, duration
    SOUND METALEXPLODE slot, shrapnel, duration
    SOUND BANG slot, intensity, duration
    SOUND COIN slot, pitch, duration
    SOUND JUMP slot, power, duration
    SOUND POWERUP slot, intensity, duration
    SOUND HURT slot, severity, duration
    SOUND SHOOT slot, power, duration
    SOUND CLICK slot, sharpness, duration
    SOUND BLIP slot, pitch, duration
    SOUND PICKUP slot, brightness, duration
    SOUND SWEEPUP slot, startFreq, endFreq, duration
    SOUND SWEEPDOWN slot, startFreq, endFreq, duration
    SOUND RANDOMBEEP slot, seed, duration
    ' ── Custom synthesis ──
    SOUND TONE slot, freq, dur, waveform
    SOUND NOTE slot, midi, dur, wf, attack, decay, sustain, release
    SOUND NOISE slot, noiseType, dur
    SOUND FM slot, carrierFreq, modFreq, modIndex, dur
    SOUND FILTER TONE slot, freq, dur, wf, filterType, cutoff, resonance
    SOUND FILTER NOTE slot, midi, dur, wf, a, d, s, r, ftype, cut, res
    ' ── Effects processing ──
    SOUND REVERB slot, freq, dur, wf, roomSize, damping, wet
    SOUND DELAY slot, freq, dur, wf, delayTime, feedback, mix
    SOUND DISTORT slot, freq, dur, wf, drive, tone, level
    ' ── Playback & management ──
    SOUND PLAY slot [, volume [, pan]]
    SOUND FREE slot
    SOUND FREE ALL
    SOUND VOLUME level
    SOUND STOP
    ' ── Related Guides ──
    ' articles/audio-system-guide.md
    ' articles/sound-command.md
    ' articles/ABCplayer.md
    ' articles/introduction_voicescript.md

  example: |
    ' Setup arcade SFX slots
    SOUND COIN 1, 1.2, 0.1
    SOUND JUMP 2, 0.9, 0.15
    SOUND SHOOT 3, 1.0, 0.08
    SOUND POWERUP 4, 1.0, 0.3
    SOUND EXPLODE 5, 1.0, 0.5

    PRINT "Playing Arcady SFX sequence..."
    SOUND PLAY 1 : WAIT 15
    SOUND PLAY 1 : WAIT 15
    SOUND PLAY 2 : WAIT 40
    SOUND PLAY 3 : WAIT 15
    SOUND PLAY 4 : WAIT 50
    SOUND PLAY 5 : WAIT 80

MUSIC:
  category: audio
  desc: "Music subsystem — load and play ABC notation music"
  usage: |
    MUSIC PLAY "X:1\nT:Song\nK:C\nCDEF|"
    MUSIC PLAY "X:1\nT:Song\nK:C\nCDEF|", 0.8
    MUSIC PLAY slot
    MUSIC PLAY slot, volume
    MUSIC LOAD slot, "X:1\nT:Song\nK:C\nCDEF|"
    MUSIC LOAD FILE slot, "song.abc"
    MUSIC STOP
    MUSIC PAUSE
    MUSIC RESUME
    MUSIC VOLUME level
    MUSIC FREE slot
    MUSIC FREE ALL
    MUSIC RENDER slot, "abc$", soundSlot [, duration, sampleRate]
    MUSIC RENDER WAV "abc$", "output.wav" [, duration, sampleRate]
    MUSIC EXPORT MIDI slot, "output.mid"
    ' ── Related Guides ──
    ' articles/audio-system-guide.md
    ' articles/ABCplayer.md
    ' articles/sound-command.md
    ' articles/introduction_voicescript.md

  example: |
    ' Arcade Fanfare (Multi-voice ABC)
    DIM fan$ = "X:1\nM:4/4\nL:1/8\nQ:1/4=150\nK:C\n"
    fan$ &= "V:1 name=Lead program=80\n"
    fan$ &= "V:2 name=Bass program=37\n"
    fan$ &= "[V:1] c2 e2 g2 c'2 | b2 a2 g2 f2 | e4 c4 |]\n"
    fan$ &= "[V:2] C,2 G,,2 C,2 G,,2 | F,,2 C,,2 G,,2 D,,2 | C,4 C,,4 |]"
    
    MUSIC PLAY fan$
    PRINT "Playing fanfare..."
    WAIT 300
    MUSIC STOP

VS:
  category: audio
  desc: "Voice Synthesiser — real-time polyphonic software synth"
  usage: |
    ' ── Oscillator ──
    VS WAVEFORM voice, waveformType
    VS FREQUENCY voice, hz
    VS NOTE voice, midiNote
    VS NOTENAME voice, "C-4"
    VS PULSE voice, width
    ' ── Envelope & Gate ──
    VS ENVELOPE voice, attack, decay, sustain, release
    VS GATE voice, ON/OFF
    ' ── Volume & Pan ──
    VS VOLUME voice, level
    VS PAN voice, position
    VS MASTER level
    ' ── Filter ──
    VS FILTER TYPE filterType
    VS FILTER CUTOFF hz
    VS FILTER RESONANCE q
    VS FILTER ON
    VS FILTER OFF
    VS FILTER ROUTE voice, ON/OFF
    ' ── Modulation ──
    VS RING voice, sourceVoice
    VS SYNC voice, sourceVoice
    VS PORTAMENTO voice, seconds
    VS DETUNE voice, cents
    ' ── Per-Voice Delay ──
    VS DELAY voice, ON/OFF
    VS DELAY TIME voice, seconds
    VS DELAY FEEDBACK voice, amount
    VS DELAY MIX voice, wetDry
    ' ── LFO ──
    VS LFO WAVEFORM lfo, waveform
    VS LFO RATE lfo, hz
    VS LFO RESET lfo
    VS LFO PITCH voice, lfo, depth
    VS LFO VOLUME voice, lfo, depth
    VS LFO FILTER voice, lfo, depth
    VS LFO PULSE voice, lfo, depth
    ' ── Physical Modeling ──
    VS PHYSICAL voice, model
    VS PHYSICAL DAMPING voice, val
    VS PHYSICAL BRIGHTNESS voice, val
    VS PHYSICAL EXCITATION voice, val
    VS PHYSICAL RESONANCE voice, val
    VS PHYSICAL TENSION voice, val
    VS PHYSICAL PRESSURE voice, val
    VS PHYSICAL TRIGGER voice
    ' ── Global Control ──
    VS RESET
    VS STOP
    ' ── Recording ──
    VS RECORD START
    VS RECORD TEMPO bpm
    VS RECORD WAIT beats
    VS RECORD SAVE slot, volume
    VS RECORD PLAY
    VS RECORD WAV "filename.wav"
    ' ── Related Guides ──
    ' articles/audio-system-guide.md
    ' articles/introduction_voicescript.md
    ' articles/advanced_voicescript.md
    ' articles/workers.md

  example: |
    ' Fun synth lead with built-in Echo (VS DELAY)
    VS RESET
    VS WAVEFORM 1, 3      ' Sawtooth
    VS ENVELOPE 1, 0.05, 0.1, 0.5, 0.4
    
    ' Setup rhythmic echo
    VS DELAY 1, ON
    VS DELAY TIME 1, 0.25
    VS DELAY FEEDBACK 1, 0.6
    VS DELAY MIX 1, 0.5
    
    PRINT "Synth sequence..."
    FOR pitch = 60 TO 72 STEP 4
        VS NOTE 1, pitch
        VS GATE 1, ON
        WAIT 10 : VS GATE 1, OFF
        WAIT 40
    NEXT
    
    PRINT "Echoes ringing out..."
    WAIT 200

# ═══════════════════════════════════════════════════════════════════════════════
#  Joystick / Gamepad
# ═══════════════════════════════════════════════════════════════════════════════

JOYAXIS:
  category: joystick
  desc: "Returns the value of a joystick/gamepad axis (-1.0 to 1.0)"
  usage: |
    x = JOYAXIS(joy_id, axis_id)
  example: |
    ' Get first joystick, horizontal axis (0)
    vx = JOYAXIS(0, 0)
    vy = JOYAXIS(0, 1)
    PRINT "Stick: "; vx; ", "; vy

JOYBUTTON:
  category: joystick
  desc: "Returns TRUE if a joystick button is currently pressed"
  usage: |
    IF JOYBUTTON(joy_id, button_id) THEN PRINT "pressed"
  example: |
    ' Button 0 is usually the primary action (A/X)
    IF JOYBUTTON(0, 0) THEN 
       SOUND 1, 440, 5, 10
    END IF

JOYCOUNT:
  category: joystick
  desc: "Returns the number of connected gamepads detected by the OS"
  usage: |
    n = JOYCOUNT
  example: |
    DIM count AS INTEGER = JOYCOUNT
    IF count = 0 THEN
       PRINT "Please connect a gamepad"
    ELSE
       PRINT "Found "; count; " device(s)"
    END IF

# ═══════════════════════════════════════════════════════════════════════════════
#  Timing
# ═══════════════════════════════════════════════════════════════════════════════

AFTER:
  category: timing
  desc: "Schedules a subroutine to run once after a delay"
  usage: |
    AFTER delay GOSUB handler
    AFTER 1000 MS GOSUB OnTimeout
    AFTER 5 SECS GOSUB Cleanup

  example: |
    SUB Task() : PRINT "Time is up!" : END SUB
    AFTER 250 MS GOSUB Task

EVERY:
  category: timing
  desc: "Schedules a subroutine to run repeatedly at a fixed interval"
  usage: |
    EVERY interval GOSUB handler
    EVERY 100 MS GOSUB OnTick
    EVERY 1 SECS GOSUB UpdateClock

  example: |
    SUB Tick() : PRINT "." : END SUB
    EVERY 100 MS GOSUB Tick

FRAMES:
  category: timing
  desc: "Time unit: frame ticks (for AFTER/EVERY with frame-based timing)"
  usage: |
    AFTER 60 FRAMES GOSUB OnSecond

  example: |
    EVERY 60 FRAMES GOSUB PerSecondTick

MS:
  category: timing
  desc: "Time unit: milliseconds"
  usage: |
    WAIT 50 MS
    AFTER 1000 MS GOSUB handler

  example: |
    WAIT 75

SECS:
  category: timing
  desc: "Time unit: seconds"
  usage: |
    WAIT 200
    EVERY 1 SECS GOSUB UpdateClock

  example: |
    WAIT_MS 10 * 1000  ' 10 seconds wait
    WAIT 300

TIMER:
  category: timing
  desc: "Returns the elapsed time since program start (in centiseconds)"
  usage: |
    t = TIMER
    elapsed = TIMER - start_time

  example: |
    DIM t1 AS LONG
    DIM t2 AS LONG
    t1 = TIMER
    FOR i = 1 TO 1000000 : NEXT i
    t2 = TIMER
    PRINT "Centiseconds elapsed: "; t2 - t1

MINUTES:
  category: timing
  desc: "Time unit: minutes (for AFTER/EVERY timing)"
  usage: |
    AFTER 5 MINUTES GOSUB LongTimeout
    EVERY 1 MINUTES GOSUB Heartbeat

  example: |
    AFTER 1 MINUTES GOSUB OneMinuteReminder

# ═══════════════════════════════════════════════════════════════════════════════
#  System / Shell
# ═══════════════════════════════════════════════════════════════════════════════

COMMAND:
  category: system
  desc: "Returns the command-line arguments passed to the program"
  usage: |
    args$ = COMMAND
    arg$ = COMMAND(n)

  example: |
    PRINT "All args: "; COMMAND
    FOR i = 1 TO COMMANDCOUNT
        PRINT "Arg "; i; " is "; COMMAND(i)
    NEXT i

COMMANDCOUNT:
  category: system
  desc: "Returns the number of command-line arguments"
  usage: |
    n = COMMANDCOUNT

  example: |
    PRINT "Number of arguments: "; COMMANDCOUNT

RUN:
  category: system
  desc: "Restarts the current program from the beginning"
  usage: |
    RUN

  example: |
    IF restarts < 3 THEN
        restarts = restarts + 1
        RUN
    END IF

SHELL:
  category: system
  desc: "Executes an operating system command"
  usage: |
    SHELL "ls -la"
    result = SHELL("command")

  example: |
    ' Simple shell execution:
    SHELL "ls -l"
    ' Capturing exit code:
    DIM status AS INTEGER
    status = SHELL("ls /nonexistent")
    PRINT "Exit status: "; status

SYSTEM:
  category: system
  desc: "Terminates the program and returns to the operating system"
  usage: |
    SYSTEM
    SYSTEM exit_code

  example: |
    ' Terminate with success:
    SYSTEM 0
    ' Terminate with failure:
    PRINT "Error occurred!"
    SYSTEM 1

# ═══════════════════════════════════════════════════════════════════════════════
#  Miscellaneous
# ═══════════════════════════════════════════════════════════════════════════════

LINE:
  category: graphics
  desc: "Draws a line between two points"
  usage: |
    LINE x1, y1, x2, y2
    LINE x1, y1, x2, y2, colour

# ═══════════════════════════════════════════════════════════════════════════════
#  GPU Sprites
# ═══════════════════════════════════════════════════════════════════════════════

SPRITE:
  category: gpu_sprite
  desc: "Places a sprite instance on screen (or issues a subcommand). Definitions hold pixel data (0–1023), instances are placed copies (0–255)."
  usage: |
    SPRITE inst, def, x, y
    SPRITE DEF id, w, h
    SPRITE DATA id, x, y, colour_index
    SPRITE COMMIT id
    SPRITE PALETTE id, idx, r, g, b
    SPRITE STD PAL id, palette_id
    SPRITE FRAMES id, fw, fh, count
    SPRITE LOAD id, "file.sprtz"
    SPRITE SHOW inst
    SPRITE HIDE inst
    SPRITE REMOVE inst
    SPRITE REMOVE ALL
    SPRITE POS inst, x, y
    SPRITE MOVE inst, dx, dy
    SPRITE ROT inst, angle_degrees
    SPRITE SCALE inst, sx, sy
    SPRITE ANCHOR inst, ax, ay
    SPRITE FLIP inst, h, v
    SPRITE ALPHA inst, a
    SPRITE PRIORITY inst, pri
    SPRITE BLEND inst, mode
    SPRITE FRAME inst, n
    SPRITE ANIMATE inst, speed
    SPRITE GLOW inst, radius, r, g, b
    SPRITE OUTLINE inst, thickness, r, g, b
    SPRITE SHADOW inst, ox, oy, a, r, g, b
    SPRITE TINT inst, factor, r, g, b
    SPRITE FLASH inst, speed, r, g, b
    SPRITE FX inst, effect_type
  example: |
    ' Setup a 16x16 sprite: allocate, draw, commit
    SPRITE DEF 0, 16, 16
    FOR y = 0 TO 15 : FOR x = 0 TO 15
      SPRITE DATA 0, x, y, (x+y) MOD 16
    NEXT x : NEXT y
    SPRITE COMMIT 0
    
    ' Create and configure instance
    SPRITE 0, 0, 160, 100
    SPRITE SHOW 0
    SPRITE SCALE 0, 4, 4
    SPRITE ANIMATE 0, 0.2
    SPRITE GLOW 0, 10, 255, 200, 0
    SPRITE PAL OVERRIDE inst, def_id
    SPRITE PAL RESET inst
    SPRITE COLLIDE inst, group
    SPRITE REMOVE inst
    SPRITE REMOVE ALL
    SPRITE SYNC

SPRITEX:
  category: gpu_sprite
  desc: "Returns the current X position of a sprite instance"
  usage: |
    x = SPRITEX(inst)
  example: |
    PRINT "Enemy X: "; SPRITEX(1)

SPRITEY:
  category: gpu_sprite
  desc: "Returns the current Y position of a sprite instance"
  usage: |
    y = SPRITEY(inst)
  example: |
    PRINT "Enemy Y: "; SPRITEY(1)

SPRITEGETROT:
  category: gpu_sprite
  desc: "Returns the current rotation angle (degrees) of a sprite instance"
  usage: |
    angle = SPRITEGETROT(inst)
  example: |
    PRINT "Rotation: "; SPRITEGETROT(0)

SPRITEVISIBLE:
  category: gpu_sprite
  desc: "Returns 1 if the sprite instance is visible (SHOW), 0 if hidden (HIDE)"
  usage: |
    IF SPRITEVISIBLE(inst) THEN PRINT "visible"
  example: |
    IF NOT SPRITEVISIBLE(player) THEN 
       PRINT "Respawning..."
    END IF

SPRITEGETFRAME:
  category: gpu_sprite
  desc: "Returns the current animation frame index of a sprite instance"
  usage: |
    f = SPRITEGETFRAME(inst)
  example: |
    IF SPRITEGETFRAME(0) = 3 THEN
       PRINT "Animation Cycle Complete"
    END IF

SPRITEHIT:
  category: gpu_sprite
  desc: "Tests bounding-box collision between two sprite instances. Returns 1 if they overlap, 0 otherwise."
  usage: |
    IF SPRITEHIT(a, b) THEN PRINT "hit!"

SPRITECOUNT:
  category: gpu_sprite
  desc: "Returns the number of active sprite instances"
  usage: |
    n = SPRITECOUNT()

SPRITEOVERLAP:
  category: gpu_sprite
  desc: "Tests whether any sprite in collision group A overlaps any sprite in group B. Returns 1 if overlap detected."
  usage: |
    IF SPRITEOVERLAP(1, 2) THEN PRINT "groups collide"

# ═══════════════════════════════════════════════════════════════════════════════
#  ARM64 Bit-Manipulation Intrinsics
# ═══════════════════════════════════════════════════════════════════════════════
#
#  These functions compile directly to dedicated ARM64 instructions — no
#  runtime library call overhead.  They give BASIC programmers easy access
#  to the processor's powerful bitfield extraction, insertion, and counting
#  instructions (UBFX, SBFX, BFI, BFC, CLZ, RBIT, REV, CNT).

BITGET:
  category: bit_manipulation
  desc: "Get a single bit from a value — returns 0 or 1"
  usage: |
    result% = BITGET(value%, bitPosition%)

  example: |
    PRINT BITGET(&HFF, 3)   ' 1
    PRINT BITGET(&HF0, 2)   ' 0
    PRINT BITGET(2, 1)      ' 1 (2 is 10b)

BITSET:
  category: bit_manipulation
  desc: "Set (turn on) a single bit — returns the modified value"
  usage: |
    result% = BITSET(value%, bitPosition%)

  example: |
    PRINT BITSET(0, 4)      ' 16 (&H10)
    PRINT BITSET(7, 3)      ' 15 (0111b -> 1111b)

BITCLR:
  category: bit_manipulation
  desc: "Clear (turn off) a single bit — returns the modified value"
  usage: |
    result% = BITCLR(value%, bitPosition%)

  example: |
    PRINT BITCLR(&HFF, 3)   ' 247 (&HF7)
    PRINT BITCLR(15, 0)     ' 14 (1111b -> 1110b)

BITTGL:
  category: bit_manipulation
  desc: "Toggle (flip) a single bit — returns the modified value"
  usage: |
    result% = BITTGL(value%, bitPosition%)

  example: |
    PRINT BITTGL(5, 0)      ' 4 (101b -> 100b)
    PRINT BITTGL(4, 0)      ' 5 (100b -> 101b)

BITFIELD:
  category: bit_manipulation
  desc: "Extract an unsigned bitfield — ARM64 UBFX instruction"
  usage: |
    result% = BITFIELD(value%, startBit%, width%)

  example: |
    PRINT HEX$(BITFIELD(&HABCD, 8, 4))   ' B
    ' Extract low byte:
    DIM word AS INTEGER = &H1234
    PRINT HEX$(BITFIELD(word, 0, 8))     ' 34

BITSFIELD:
  category: bit_manipulation
  desc: "Extract a signed bitfield (sign-extends the result) — ARM64 SBFX instruction"
  usage: |
    result% = BITSFIELD(value%, startBit%, width%)

  example: |
    ' Extract a 5-bit signed value from bits 4-8:
    ' &H1F0 is 1_1111_0000 in binary.
    ' Bits 4-8 are 11111 (binary for -1 if 5-bit signed)
    PRINT BITSFIELD(&H1F0, 4, 5)   ' -1

BITINS:
  category: bit_manipulation
  desc: "Insert a bitfield into a value — ARM64 BFI instruction"
  usage: |
    result% = BITINS(dest%, source%, startBit%, width%)

  example: |
    ' Insert &HA (1010b) into &HF00F at bit 8 (width 4):
    PRINT HEX$(BITINS(&HF00F, &HA, 8, 4))  ' FA0F

BITCLRF:
  category: bit_manipulation
  desc: "Clear (zero out) a range of bits — ARM64 BFC instruction"
  usage: |
    result% = BITCLRF(value%, startBit%, width%)

  example: |
    ' Clear bits 4-7:
    PRINT HEX$(BITCLRF(&HFFFF, 4, 4))   ' FF0F

CLZ:
  category: bit_manipulation
  desc: "Count leading zeros — ARM64 CLZ instruction"
  usage: |
    n% = CLZ(value%)

  example: |
    PRINT CLZ(1)        ' 63 (on a 64-bit value)
    PRINT CLZ(&H8000000000000000)  ' 0
    PRINT CLZ(0)        ' 64

CTZ:
  category: bit_manipulation
  desc: "Count trailing zeros — ARM64 RBIT+CLZ instruction pair"
  usage: |
    n% = CTZ(value%)

  example: |
    PRINT CTZ(1)        ' 0
    PRINT CTZ(8)        ' 3 (8 = 1000b)
    PRINT CTZ(&H80)     ' 7

POPCNT:
  category: bit_manipulation
  desc: "Population count — count the number of set (1) bits. Uses ARM64 NEON CNT instruction."
  usage: |
    n% = POPCNT(value%)

  example: |
    PRINT POPCNT(&HFF)      ' 8
    PRINT POPCNT(&H55)      ' 4 (01010101b)

BITREV:
  category: bit_manipulation
  desc: "Reverse all bits — ARM64 RBIT instruction"
  usage: |
    result% = BITREV(value%)

  example: |
    ' Reverse bit order:
    PRINT HEX$(BITREV(1))   ' 8000000000000000

BYTEREV:
  category: bit_manipulation
  desc: "Reverse byte order (64-bit endian swap) — ARM64 REV instruction. Reverses all 8 bytes of the 64-bit integer value."
  usage: |
    result% = BYTEREV(value%)

  example: |
    PRINT HEX$(BYTEREV(&H0102030405060708))  ' 0807060504030201

# ═══════════════════════════════════════════════════════════════════════════════
#  Array Reductions
#  Functions that reduce a whole array to a single scalar value.
#  Uses SIMD/vectorized code paths when available.
# ═══════════════════════════════════════════════════════════════════════════════

SUM:
  category: array_reduction
  desc: "Sum of all elements in an array — SIMD-accelerated whole-array reduction"
  usage: |
    result# = SUM(A())
    ' Sum a DOUBLE array:
    DIM A(4) AS DOUBLE
    A(0) = 1.0 : A(1) = 2.0 : A(2) = 3.0 : A(3) = 4.0 : A(4) = 5.0
    PRINT SUM(A())          ' prints 15
    ' Sum an INTEGER array:
    DIM B(3) AS INTEGER
    B(0) = 10 : B(1) = 20 : B(2) = 30 : B(3) = 40
    PRINT SUM(B())          ' prints 100

  example: |
    DIM vals(5) AS DOUBLE
    vals(1) = 1.0 : vals(2) = 2.0 : vals(3) = 3.0 : vals(4) = 4.0 : vals(5) = 5.0
    PRINT SUM(vals())    ' 15


AVG:
  category: array_reduction
  desc: "Average (arithmetic mean) of all elements in an array — SIMD-accelerated"
  usage: |
    result# = AVG(A())
    ' Compute the mean of a DOUBLE array:
    DIM A(4) AS DOUBLE
    A(0) = 1.0 : A(1) = 2.0 : A(2) = 3.0 : A(3) = 4.0 : A(4) = 5.0
    PRINT AVG(A())          ' prints 3
    ' Works with INTEGER arrays (integer division):
    DIM B(3) AS INTEGER
    B(0) = 10 : B(1) = 20 : B(2) = 30 : B(3) = 40
    PRINT AVG(B())          ' prints 25

  example: |
    DIM vals(4) AS DOUBLE
    vals(1) = 10.0 : vals(2) = 20.0 : vals(3) = 30.0 : vals(4) = 40.0
    PRINT AVG(vals())    ' 25


DOT:
  category: array_reduction
  desc: "Dot product of two arrays — SIMD-accelerated sum of element-wise products"
  usage: |
    result# = DOT(A(), B())

  example: |
    DIM A(3) AS DOUBLE
    DIM B(3) AS DOUBLE
    A(1) = 1.0 : A(2) = 2.0 : A(3) = 3.0
    B(1) = 4.0 : B(2) = 5.0 : B(3) = 6.0
    PRINT DOT(A(), B())     ' prints 32 (1*4 + 2*5 + 3*6)

PRODUCT:
  category: array_reduction
  desc: "Product of all elements in an array — SIMD-accelerated whole-array reduction"
  usage: |
    result# = PRODUCT(A())

  example: |
    DIM vals(4) AS DOUBLE
    vals(1) = 1.0 : vals(2) = 2.0 : vals(3) = 3.0 : vals(4) = 4.0
    PRINT PRODUCT(vals())    ' 24


NORM:
  category: array_reduction
  desc: "Euclidean norm (magnitude) of an array — sqrt(sum of squares)"
  usage: |
    result# = NORM(A())

  example: |
    DIM v(3) AS DOUBLE
    v(1) = 3.0 : v(2) = 4.0 : v(3) = 0.0
    PRINT NORM(v())    ' 5  (classic 3-4-5 triangle)


COUNT:
  category: array_reduction
  desc: "Number of elements in an array"
  usage: |
    result% = COUNT(A())

  example: |
    DIM nums(5) AS INTEGER
    PRINT COUNT(nums())    ' 5


SUMSQ:
  category: array_reduction
  desc: "Sum of squares of all elements — SIMD-accelerated reduction"
  usage: |
    result# = SUMSQ(A())

  example: |
    DIM A(3) AS DOUBLE
    A(1) = 1.0 : A(2) = 2.0 : A(3) = 3.0
    PRINT SUMSQ(A())        ' prints 14 (1+4+9)

RMS:
  category: array_reduction
  desc: "Root mean square — SIMD-accelerated sqrt(sum of squares / count)"
  usage: |
    result# = RMS(A())

  example: |
    DIM A(4) AS DOUBLE
    A(1) = 1.0 : A(2) = 2.0 : A(3) = 3.0 : A(4) = 4.0
    PRINT RMS(A())           ' prints 2.7386 (sqrt(30/4))

RANGE:
  category: array_reduction
  desc: "Range of an array (max - min) — single-pass with two accumulators"
  usage: |
    result = RANGE(A())

  example: |
    DIM vals(5) AS DOUBLE
    vals(1) = 3.0 : vals(2) = 7.0 : vals(3) = 1.0 : vals(4) = 9.0 : vals(5) = 4.0
    PRINT RANGE(vals())    ' 8  (max 9 - min 1)

ANY:
  category: array_reduction
  desc: "Returns 1 if any element is non-zero, else 0 — short-circuits on first match"
  usage: |
    result% = ANY(A())

  example: |
    DIM flags(4) AS INTEGER
    flags() = 0
    flags(2) = 1
    IF ANY(flags()) THEN PRINT "something set" ELSE PRINT "all clear"
    ' short-circuits: stops at flags(2), never reads flags(3) or flags(4)

ALL:
  category: array_reduction
  desc: "Returns 1 if all elements are non-zero, else 0 — short-circuits on first zero"
  usage: |
    result% = ALL(A())

  example: |
    DIM filled(4) AS INTEGER
    filled() = 1
    PRINT ALL(filled())     ' 1
    filled(3) = 0
    PRINT ALL(filled())     ' 0

  example: |
    DIM ready(3) AS INTEGER
    ready() = 1
    IF ALL(ready()) THEN PRINT "all ready" ELSE PRINT "not ready"
    ' short-circuits: stops at first zero, skips the rest


# ═══════════════════════════════════════════════════════════════════════════════
#  Math Functions
#  Scalar math functions that also work element-wise on whole arrays.
#  When passed A(), they return a new array with the function applied
#  to every element, using SIMD vectorization.
# ═══════════════════════════════════════════════════════════════════════════════

SIN:
  category: math
  desc: "Sine — scalar or element-wise on a whole array"
  usage: |
    result# = SIN(angle#)
    ' Element-wise on an array:
    DIM A(3) AS DOUBLE
    DIM B(3) AS DOUBLE
    A(0) = 0.0 : A(1) = 1.5708 : A(2) = 3.1416 : A(3) = 4.7124
    B() = SIN(A())
    ' B() is now {0.0, 1.0, 0.0, -1.0}

  example: |
    DIM pi AS DOUBLE
    pi = 3.14159265358979
    PRINT SIN(0.0)          ' 0
    PRINT SIN(pi / 6.0)     ' 0.5
    PRINT SIN(pi / 2.0)     ' 1
    PRINT SIN(pi)           ' ~0 (tiny floating-point residual)


COS:
  category: math
  desc: "Cosine — scalar or element-wise on a whole array"
  usage: |
    result# = COS(angle#)
    ' Element-wise on an array:
    DIM A(3) AS DOUBLE
    DIM B(3) AS DOUBLE
    B() = COS(A())

  example: |
    DIM pi AS DOUBLE
    pi = 3.14159265358979
    PRINT COS(0.0)          ' 1
    PRINT COS(pi / 3.0)     ' 0.5
    PRINT COS(pi / 2.0)     ' ~0
    PRINT COS(pi)           ' -1


TAN:
  category: math
  desc: "Tangent — scalar or element-wise on a whole array"
  usage: |
    result# = TAN(angle#)
    ' Element-wise on an array:
    DIM A(3) AS DOUBLE
    DIM B(3) AS DOUBLE
    B() = TAN(A())

  example: |
    DIM pi AS DOUBLE
    pi = 3.14159265358979
    PRINT TAN(0.0)           ' 0
    PRINT TAN(pi / 4.0)      ' 1
    PRINT TAN(pi / 6.0)      ' 0.57735...


ATN:
  category: math
  desc: "Arctangent — scalar or element-wise on a whole array"
  usage: |
    result# = ATN(value#)
    ' Element-wise on an array:
    DIM A(3) AS DOUBLE
    DIM B(3) AS DOUBLE
    B() = ATN(A())

  example: |
    DIM pi AS DOUBLE
    ' ATN(1) * 4 gives pi:
    pi = ATN(1.0) * 4.0
    PRINT pi                  ' 3.14159265358979
    PRINT ATN(0.0)            ' 0
    PRINT ATN(1.0)            ' 0.785... (pi/4)


EXP:
  category: math
  desc: "Exponential (e^x) — scalar or element-wise on a whole array"
  usage: |
    result# = EXP(x#)
    ' Element-wise on an array:
    DIM A(3) AS DOUBLE
    DIM B(3) AS DOUBLE
    A(0) = 0.0 : A(1) = 1.0 : A(2) = 2.0 : A(3) = 3.0
    B() = EXP(A())
    ' B() is now {1.0, 2.7183, 7.3891, 20.0855}

  example: |
    PRINT EXP(0.0)    ' 1
    PRINT EXP(1.0)    ' 2.71828... (e)
    PRINT EXP(2.0)    ' 7.38906...
    ' e^x and LOG are inverses:
    PRINT EXP(LOG(5.0))   ' ~5


LOG:
  category: math
  desc: "Natural logarithm — scalar or element-wise on a whole array"
  usage: |
    result# = LOG(x#)
    ' Element-wise on an array:
    DIM A(3) AS DOUBLE
    DIM B(3) AS DOUBLE
    A(0) = 1.0 : A(1) = 2.7183 : A(2) = 7.3891 : A(3) = 20.0855
    B() = LOG(A())
    ' B() is now {0.0, 1.0, 2.0, 3.0}

  example: |
    PRINT LOG(1.0)           ' 0
    PRINT LOG(2.71828)       ' ~1  (natural log of e)
    PRINT LOG(100.0) / LOG(10.0)   ' 2  (log base 10 via change of base)


SQR:
  category: math
  desc: "Square root — scalar or element-wise on a whole array"
  usage: |
    result# = SQR(x#)
    ' Element-wise on an array:
    DIM A(3) AS DOUBLE
    DIM B(3) AS DOUBLE
    A(0) = 1.0 : A(1) = 4.0 : A(2) = 9.0 : A(3) = 16.0
    B() = SQR(A())
    ' B() is now {1.0, 2.0, 3.0, 4.0}

  example: |
    PRINT SQR(25.0)    ' 5
    PRINT SQR(2.0)     ' 1.4142135623731
    ' Hypotenuse of a 3-4-5 triangle:
    DIM a AS DOUBLE
    DIM b AS DOUBLE
    a = 3.0 : b = 4.0
    PRINT SQR(a * a + b * b)    ' 5


ABS:
  category: math
  desc: "Absolute value — scalar or element-wise on a whole array"
  usage: |
    result = ABS(x)
    ' Works with DOUBLE and INTEGER:
    PRINT ABS(-5.0)          ' prints 5
    ' Element-wise on an array:
    DIM A(3) AS DOUBLE
    DIM B(3) AS DOUBLE
    A(0) = -3.0 : A(1) = 2.0 : A(2) = -1.0 : A(3) = 0.0
    B() = ABS(A())
    ' B() is now {3.0, 2.0, 1.0, 0.0}

  example: |
    PRINT ABS(-42)      ' 42
    PRINT ABS(3.14)     ' 3.14
    PRINT ABS(-0.001)   ' 0.001
    ' Useful for distance calculations:
    DIM a AS DOUBLE
    DIM b AS DOUBLE
    a = 7.5 : b = 3.0
    PRINT "Distance: "; ABS(a - b)   ' 4.5


SGN:
  category: math
  desc: "Sign function (-1, 0, or 1) — scalar or element-wise on a whole array"
  usage: |
    result% = SGN(x)
    ' Returns -1 for negative, 0 for zero, 1 for positive:
    PRINT SGN(-5.0)          ' prints -1
    PRINT SGN(0.0)           ' prints 0
    PRINT SGN(3.0)           ' prints 1
    ' Element-wise on an array:
    DIM A(3) AS DOUBLE
    DIM B(3) AS DOUBLE
    B() = SGN(A())

  example: |
    PRINT SGN(-5)    ' -1
    PRINT SGN(0)     '  0
    PRINT SGN(3)     '  1
    PRINT SGN(-0.001) ' -1


CDBL:
  category: math
  desc: "Convert to DOUBLE — scalar or element-wise on a whole array"
  usage: |
    result# = CDBL(x%)
    ' Convert INTEGER array to DOUBLE element-wise:
    DIM A(3) AS INTEGER
    DIM B(3) AS DOUBLE
    A(0) = 1 : A(1) = 2 : A(2) = 3 : A(3) = 4
    B() = CDBL(A())

  example: |
    DIM n AS INTEGER
    n = 7
    PRINT CDBL(n)          ' 7
    PRINT CDBL(255) / 2.0  ' 127.5  (integer division avoided)
    ' Without CDBL, integer / integer truncates:
    PRINT 7 / 2            ' 3  (integer division)
    PRINT CDBL(7) / 2.0    ' 3.5


CINT:
  category: math
  desc: "Convert to INTEGER — scalar or element-wise on a whole array"
  usage: |
    result% = CINT(x#)
    ' Convert DOUBLE array to INTEGER element-wise:
    DIM A(3) AS DOUBLE
    DIM B(3) AS INTEGER
    A(0) = 1.7 : A(1) = 2.3 : A(2) = 3.9 : A(3) = 4.1
    B() = CINT(A())

  example: |
    PRINT CINT(3.7)     ' 3   (truncates toward zero)
    PRINT CINT(3.2)     ' 3
    PRINT CINT(-2.9)    ' -2  (truncates toward zero)
    PRINT CINT(2.0)     ' 2


CMPLX:
  category: math
  desc: "Construct a COMPLEX value from real and imaginary parts"
  usage: |
    z = CMPLX(real_part#, imag_part#)
    DIM z AS COMPLEX
    z = CMPLX(0.5, -1.25)

  example: |
    DIM z AS COMPLEX
    z = CMPLX(3.0, 4.0)
    PRINT REAL(z)    ' 3
    PRINT IMAG(z)    ' 4


REAL:
  category: math
  desc: "Returns the real part of a COMPLEX value"
  usage: |
    x# = REAL(z)
    DIM z AS COMPLEX
    z = CMPLX(2.0, -5.0)
    PRINT REAL(z)    ' 2

  example: |
    DIM a AS COMPLEX
    DIM b AS COMPLEX
    a = CMPLX(1.0, 2.0)
    b = CMPLX(3.0, 4.0)
    PRINT REAL(a + b)   ' 4


IMAG:
  category: math
  desc: "Returns the imaginary part of a COMPLEX value"
  usage: |
    y# = IMAG(z)
    DIM z AS COMPLEX
    z = CMPLX(2.0, -5.0)
    PRINT IMAG(z)    ' -5

  example: |
    DIM z AS COMPLEX
    z = CMPLX(1.5, 0.25)
    PRINT IMAG(z)    ' 0.25


CONJ:
  category: math
  desc: "Returns the complex conjugate (negates the imaginary part)"
  usage: |
    w = CONJ(z)
    DIM z AS COMPLEX
    z = CMPLX(2.0, -3.0)
    PRINT REAL(CONJ(z)), IMAG(CONJ(z))   ' 2, 3

  example: |
    DIM z AS COMPLEX
    DIM w AS COMPLEX
    z = CMPLX(1.5, 0.25)
    w = CONJ(z)
    PRINT REAL(w)   ' 1.5
    PRINT IMAG(w)   ' -0.25


ABSZ:
  category: math
  desc: "Returns the magnitude (modulus) of a COMPLEX value"
  usage: |
    m# = ABSZ(z)
    DIM z AS COMPLEX
    z = CMPLX(3.0, 4.0)
    PRINT ABSZ(z)   ' 5

  example: |
    DIM z AS COMPLEX
    z = CMPLX(6.0, 8.0)
    PRINT ABSZ(z)   ' 10


ARG:
  category: math
  desc: "Returns the phase angle of a COMPLEX value in radians"
  usage: |
    theta# = ARG(z)
    DIM z AS COMPLEX
    z = CMPLX(0.0, 1.0)
    PRINT ARG(z)    ' ~1.57079632679 (pi/2)

  example: |
    DIM z AS COMPLEX
    z = CMPLX(-1.0, 0.0)
    PRINT ARG(z)    ' ~3.14159265359 (pi)


POLAR:
  category: math
  desc: "Constructs a COMPLEX value from polar coordinates (radius, angle)"
  usage: |
    z = POLAR(r#, theta#)
    DIM z AS COMPLEX
    z = POLAR(2.0, 0.0)
    PRINT REAL(z), IMAG(z)   ' 2, 0

  example: |
    DIM z AS COMPLEX
    z = POLAR(1.0, 1.57079632679)
    PRINT REAL(z)   ' ~0
    PRINT IMAG(z)   ' ~1


CLAMP:
  category: math
  desc: "Clamp value to range — scalar or element-wise on a whole array"
  usage: |
    result# = CLAMP(value#, lo#, hi#)
    ' Scalar: clamp a value to [0, 10]:
    PRINT CLAMP(15.0, 0.0, 10.0)   ' prints 10
    PRINT CLAMP(-5.0, 0.0, 10.0)   ' prints 0
    PRINT CLAMP(5.0, 0.0, 10.0)    ' prints 5
    ' Element-wise: clamp all array values to [0, 1]:
    DIM A(3) AS DOUBLE
    DIM B(3) AS DOUBLE
    A(0) = -0.5 : A(1) = 0.5 : A(2) = 1.5 : A(3) = 0.8
    B() = CLAMP(A(), 0.0, 1.0)
    ' B() is now {0.0, 0.5, 1.0, 0.8}

  example: |
    PRINT CLAMP(15.0, 0.0, 10.0)    ' 10  (too high — clamped)
    PRINT CLAMP(-5.0, 0.0, 10.0)    ' 0   (too low — clamped)
    PRINT CLAMP(5.0, 0.0, 10.0)     ' 5   (in range)
    ' Clamp a volume level to [0, 1]:
    DIM vol AS DOUBLE
    vol = 1.35
    vol = CLAMP(vol, 0.0, 1.0)
    PRINT vol    ' 1


LERP:
  category: math
  desc: "Linear interpolation — scalar or element-wise on whole arrays"
  usage: |
    result# = LERP(a#, b#, t#)
    ' Scalar: interpolate between two values:
    PRINT LERP(0.0, 10.0, 0.5)     ' prints 5
    PRINT LERP(10.0, 20.0, 0.25)   ' prints 12.5
    ' Element-wise: interpolate between two arrays:
    DIM A(3) AS DOUBLE
    DIM B(3) AS DOUBLE
    DIM C(3) AS DOUBLE
    C() = LERP(A(), B(), 0.5)
    ' t=0 returns A(), t=1 returns B()

  example: |
    PRINT LERP(0.0, 100.0, 0.0)     ' 0    (t=0 → start)
    PRINT LERP(0.0, 100.0, 1.0)     ' 100  (t=1 → end)
    PRINT LERP(0.0, 100.0, 0.5)     ' 50   (midpoint)
    PRINT LERP(10.0, 20.0, 0.25)    ' 12.5
    ' Fade from 0 to 255 in 4 steps:
    DIM i AS INTEGER
    FOR i = 0 TO 4
        PRINT LERP(0.0, 255.0, i / 4.0)
    NEXT i


MIN:
  category: math
  desc: "Minimum — scalar or element-wise minimum of two arrays"
  usage: |
    result = MIN(a, b)
    ' Scalar: minimum of two values:
    PRINT MIN(3, 7)          ' prints 3
    ' Element-wise: per-element minimum of two arrays:
    DIM A(3) AS DOUBLE
    DIM B(3) AS DOUBLE
    DIM C(3) AS DOUBLE
    A(0) = 1.0 : A(1) = 5.0 : A(2) = 3.0 : A(3) = 8.0
    B(0) = 4.0 : B(1) = 2.0 : B(2) = 6.0 : B(3) = 1.0
    C() = MIN(A(), B())
    ' C() is now {1.0, 2.0, 3.0, 1.0}

  example: |
    PRINT MIN(3, 7)      ' 3
    PRINT MIN(7, 3)      ' 3
    PRINT MIN(-1, -5)    ' -5
    ' Clamp a value to a maximum:
    DIM speed AS DOUBLE
    speed = 150.0
    speed = MIN(speed, 100.0)
    PRINT speed    ' 100


MAX:
  category: math
  desc: "Maximum — scalar or element-wise maximum of two arrays"
  usage: |
    result = MAX(a, b)
    ' Scalar: maximum of two values:
    PRINT MAX(3, 7)          ' prints 7
    ' Element-wise: per-element maximum of two arrays:
    DIM A(3) AS DOUBLE
    DIM B(3) AS DOUBLE
    DIM C(3) AS DOUBLE
    A(0) = 1.0 : A(1) = 5.0 : A(2) = 3.0 : A(3) = 8.0
    B(0) = 4.0 : B(1) = 2.0 : B(2) = 6.0 : B(3) = 1.0
    C() = MAX(A(), B())
    ' C() is now {4.0, 5.0, 6.0, 8.0}

  example: |
    PRINT MAX(3, 7)      ' 7
    PRINT MAX(7, 3)      ' 7
    PRINT MAX(-1, -5)    ' -1
    ' Ensure a value meets a minimum:
    DIM health AS INTEGER
    health = -10
    health = MAX(health, 0)
    PRINT health    ' 0


# ═══════════════════════════════════════════════════════════════════════════════
#  Array Sorting and Indexing
#  In-place sort and argsort (indirect sort) for typed arrays.
#  Operates on the user-visible portion of the array: elements 1..N for DIM a(N).
# ═══════════════════════════════════════════════════════════════════════════════

QSORT:
  category: array_sort
  desc: "Sorts an array in-place using quicksort. Accepts optional ASCENDING (default) or DESCENDING keyword. Works on INTEGER, DOUBLE, and STRING arrays"
  usage: |
    QSORT(a())                  ' ascending — lowest first (default)
    QSORT(a(), DESCENDING)      ' descending — highest first
    QSORT(a(), ASCENDING)       ' explicit ascending
    ' Integer example:
    DIM scores(5) AS INTEGER
    scores(1) = 42 : scores(2) = 7 : scores(3) = 19 : scores(4) = 3 : scores(5) = 55
    QSORT(scores())
    PRINT scores(1)             ' 3  (smallest)
    PRINT scores(5)             ' 55 (largest)
    QSORT(scores(), DESCENDING)
    PRINT scores(1)             ' 55 (largest)
    ' String example:
    DIM names(3) AS STRING
    names(1) = "Charlie" : names(2) = "Alice" : names(3) = "Bob"
    QSORT(names())
    PRINT names(1)              ' Alice

  example: |
    DIM scores(5) AS INTEGER
    scores(1) = 42 : scores(2) = 7 : scores(3) = 19 : scores(4) = 3 : scores(5) = 55
    QSORT(scores())
    FOR i = 1 TO 5
        PRINT scores(i)    ' 3, 7, 19, 42, 55
    NEXT i
    QSORT(scores(), DESCENDING)
    PRINT scores(1)        ' 55 (largest first)


INDEX:
  category: array_sort
  desc: "Fills a destination INTEGER array with the 1-based positions of source elements in sorted order (argsort). The source array is NOT modified. Accepts optional ASCENDING (default) or DESCENDING keyword. Works on INTEGER, DOUBLE, and STRING source arrays"
  usage: |
    INDEX(src(), dst())                  ' dst holds positions sorted ascending
    INDEX(src(), dst(), DESCENDING)      ' dst holds positions sorted descending
    ' dst(i) is the position in src of the i-th smallest element.
    ' Use it to traverse src in sorted order without reordering it:
    DIM prices(4) AS DOUBLE
    prices(1) = 9.99 : prices(2) = 4.49 : prices(3) = 14.99 : prices(4) = 1.99
    DIM order(4) AS INTEGER
    INDEX(prices(), order())
    FOR i = 1 TO 4
        PRINT prices(order(i))   ' 1.99, 4.49, 9.99, 14.99
    NEXT i
    ' Ranking — sort by score, keep original positions:
    DIM score(6) AS INTEGER
    DIM rank(6) AS INTEGER
    INDEX(score(), rank(), DESCENDING)
    PRINT "Top scorer was at position "; rank(1)

  example: |
    DIM prices(4) AS DOUBLE
    prices(1) = 9.99 : prices(2) = 4.49 : prices(3) = 14.99 : prices(4) = 1.99
    DIM order(4) AS INTEGER
    INDEX(prices(), order())
    FOR i = 1 TO 4
        PRINT prices(order(i))    ' 1.99, 4.49, 9.99, 14.99
    NEXT i


# ═══════════════════════════════════════════════════════════════════════════════
#  GUI — Windows, Menus, Dialogs
# ═══════════════════════════════════════════════════════════════════════════════

WINDOW:
  category: gui_window
  desc: "Creates and manages non-modal windows with declarative controls"
  usage: |
    WINDOW DEFINE win_id, "Title", x, y, width, height
      WINDOW LABEL ctl_id, "Text", x, y, w, h
      WINDOW BUTTON ctl_id, "Text", x, y, w, h
      WINDOW TEXTFIELD ctl_id, "Text", x, y, w, h
      WINDOW TEXTAREA ctl_id, "Text", x, y, w, h
      WINDOW COMBOBOX ctl_id, "Opt1|Opt2", x, y, w, h
      WINDOW TOOLBAR ctl_id, "Button1|Button2", x, y, w, h
      WINDOW STATUSBAR ctl_id, "Left|Middle|Right", x, y, w, h
      WINDOW POPUP ctl_id, "Opt1|Opt2", x, y, w, h
      WINDOW SLIDER ctl_id, min, max, x, y, w, h
      WINDOW PROGRESS ctl_id, min, max, x, y, w, h
      WINDOW SECUREFIELD ctl_id, "Placeholder", x, y, w, h
      WINDOW CHECKBOX ctl_id, "Label", x, y, w, h
    END WINDOW
    WINDOW SHOW win_id
    ' Poll events (either struct form or out-params):
    WINDOW EVENT win_id AS ev
    status = WINDOW EVENT(win, ctl)
    IF WINDOW CLOSED(win_id) THEN ...
    WINDOW CLOSE win_id
    WINDOW SHUTDOWN

WINDOW CANVAS:
  category: gui_window
  desc: "Batches retained drawing commands into a window canvas control"
  usage: |
    WINDOW CANVAS BEGIN win_id, canvas_ctl_id
      PAPER r, g, b, a
      CLEAR
      COLOR r, g, b, a
      LINE x1, y1, x2, y2
      PATH MOVE x, y
      PATH ...
      PATH STROKE
    WINDOW CANVAS END
    WINDOW CANVAS VIRTUALSIZE win_id, canvas_ctl_id, virtual_w, virtual_h
    WINDOW CANVAS VIEWPORT win_id, canvas_ctl_id, x, y
    WINDOW CANVAS RESOLUTION win_id, canvas_ctl_id, width, height

WINDOW IMAGE:
  category: gui_image
  desc: "Creates and updates offscreen images using canvas-style drawing commands"
  usage: |
    WINDOW IMAGE CREATE image_id, width, height [, format]
    WINDOW IMAGE DEFINE image_id, width, height [, format]
    WINDOW IMAGE BEGIN image_id
      PAPER r, g, b, a
      CLEAR
      COLOR r, g, b, a
      LINE x1, y1, x2, y2
      RECT x, y, w, h, filled
      ARC cx, cy, r, a0, a1, filled
      PATH MOVE x, y
      PATH ...
      PATH STROKE
    WINDOW IMAGE END
    WINDOW IMAGE DESTROY image_id
    WINDOW IMAGE CLEAR
    WINDOW IMAGE SAVE image_id, "file.png"
    WINDOW IMAGE EFFECT image_id, "FXAA", p1, p2 [, p3, p4]

IMAGE:
  category: gui_image
  desc: "Image operation aliases for save and post-processing effects"
  usage: |
    IMAGE SAVE image_id, "file.png"
    IMAGE EFFECT image_id, "FXAA", p1, p2 [, p3, p4]
    IMAGE EFFECT image_id, "BLUR", radius, iterations
    IMAGE EFFECT image_id, "GRAYSCALE" [, amount_0_to_1]
    IMAGE EFFECT image_id, "SEPIA" [, amount_0_to_1]
    IMAGE EFFECT image_id, "INVERT" [, amount_0_to_1]
    IMAGE EFFECT image_id, "BRIGHTNESS", delta_-1_to_1
    IMAGE EFFECT image_id, "CONTRAST", factor_0_to_4   ' 1.0 = unchanged
    IMAGE EFFECT image_id, "SATURATION", factor_0_to_4 ' 1.0 = unchanged
    IMAGE EFFECT image_id, "SHARPEN" [, amount_0_to_3]
    IMAGE EFFECT image_id, "GAMMA", gamma_0.1_to_5     ' 1.0 = unchanged
    IMAGE EFFECT image_id, "VIGNETTE" [, strength_0_to_1, softness_0.2_to_6]
    IMAGE EFFECT image_id, "EDGE" [, strength_0.1_to_4, threshold_0_to_1]
    IMAGE EFFECT image_id, "EDGEDETECT" [, strength_0.1_to_4, threshold_0_to_1]
    IMAGE EFFECT image_id, "POSTERIZE", levels_2_to_64

WINDOW SET TEXT:
  category: gui_window
  desc: "Sets the text of a window control (label, text field, textarea, combo/popup selection label). Status bars accept left/middle/right segments (write-only)."
  usage: |
    WINDOW SET TEXT win_id, ctl_id, "Hello"
    WINDOW SET TEXT win_id, ctl_id, left$, middle$, right$   ' status bar segments
    txt$ = WINDOW TEXT$(win_id, ctl_id)
    txt$ = WINDOW GET TEXT win_id, ctl_id

WINDOW SET VALUE:
  category: gui_window
  desc: "Sets or reads numeric control values (slider, progress, combo/popup index)"
  usage: |
    WINDOW SET VALUE win_id, ctl_id, value
    v = WINDOW VALUE(win_id, ctl_id)
    v = WINDOW GET VALUE win_id, ctl_id

WINDOW SET TITLE:
  category: gui_window
  desc: "Changes a window's title bar text at runtime"
  usage: |
    WINDOW SET TITLE win_id, "New Title"

WINDOW CHECKED:
  category: gui_window
  desc: "Reads checkbox state"
  usage: |
    is_on = WINDOW CHECKED(win_id, ctl_id)

MENU:
  category: gui_menu
  desc: "Defines a native menu bar and handles menu events"
  usage: |
    MENU DEFINE
      MENU "File"
        ITEM 100, "Open", "Cmd+O"
        ITEM 101, "Quit", "Cmd+Q"
        SEPARATOR
        ITEM 102, "Toggle", "", CHECKED
      END MENU
    END DEFINE
    ev = MENU EVENT()
    MENU CHECK item_id, 0 or 1
    MENU RESET

DIALOG:
  category: gui_dialog
  desc: "Builds and shows modal native dialogs with controls"
  usage: |
    DIALOG DEFINE dlg_id
      TITLE "Dialog Title"
      MESSAGE "Message text"
      LABEL "Static text"
      NUMBERFIELD 10, "Label", initial, min, max
      DROPDOWN 20, "Label", "Opt1|Opt2", default_index
      CHECKBOX 30, "Label", CHECKED
      BUTTON 1, "OK", DEFAULT
      BUTTON 2, "Cancel", CANCEL
    END DEFINE

    DIALOG SETTEXT 10, "updated"
    DIALOG SETNUMBER 10, 123.45
    DIALOG SETSELECTION 20, 0
    DIALOG SETCHECKED 30, 1
    choice = DIALOG SHOW(dlg_id)
    txt$ = DIALOG TEXT$(10)
    sel  = DIALOG SELECTION(20)
    on   = DIALOG CHECKED(30)
    DIALOG RESET

