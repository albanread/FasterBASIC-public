  example: |
    ' Clear to dark blue
    GCLS RGB(0, 0, 100)

HLINE:
  category: graphics
  desc: "Draws a horizontal line"
  usage: |
    HLINE x1, x2, y
    HLINE x1, x2, y, colour

  example: |
    HLINE 10, 200, 50, RGB(255, 255, 255)

PGET:
  category: graphics
  desc: "Returns the colour of a pixel at the given coordinates"
  usage: |
    c = PGET(x, y)

